.follow-review-more{margin:12px 0 4px;color:var(--muted);font-size:12px}
.follow-review-more>summary{line-height:1.8;cursor:pointer;padding:6px 0}
.follow-review-more .follow-fields{color:var(--ink)}

/* Three-scenario guidance */
.scenario-step h2{font-size:20px;line-height:1.5;margin:0 0 24px;font-weight:650;letter-spacing:-.02em}
.scenario-step form{display:flex;flex-direction:column;gap:19px;min-width:0}
.scenario-step .field{margin:0;min-width:0}
.scenario-step input:not([type=checkbox]):not([type=hidden]),.scenario-step select,.scenario-step textarea{width:100%;min-width:0;font-size:14px}
.scenario-step textarea{min-height:92px;resize:vertical}
.scenario-step fieldset{border:0;margin:0;padding:0;min-width:0}
.scenario-step legend{font-size:13px;font-weight:600;margin-bottom:11px;padding:0}
.scenario-checks{display:flex;flex-direction:column;gap:3px}
.scenario-checks label,.scenario-choice{display:flex;align-items:center;gap:11px;min-height:44px;font-size:14px;cursor:pointer}
.scenario-step input[type=checkbox]{width:18px;height:18px;flex:0 0 18px;accent-color:var(--accent)}
.scenario-step input:focus-visible,.scenario-step select:focus-visible,.scenario-step textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.scenario-step-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.scenario-step-actions .primary{flex:1;margin:0;min-height:46px}
.scenario-step-actions .secondary{min-height:46px}
.scenario-history{border-bottom:1px solid var(--line);padding-bottom:13px;max-width:100%}
.scenario-history>span{font-size:12px;color:var(--muted)}
.scenario-history p{font-size:14px;line-height:1.7;margin:5px 0 0;overflow-wrap:anywhere}
.scenario-note,.scenario-data-time{font-size:12px;line-height:1.75;color:var(--muted);margin:0;overflow-wrap:anywhere}
.scenario-data-time{margin-top:16px}
.scenario-provider{display:flex;align-items:center;gap:14px;min-height:48px;font-size:17px}
.scenario-provider img{width:48px;height:48px;object-fit:contain}
.scenario-provider svg{width:23px;height:23px;color:var(--accent)}
.scenario-connection-state{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);margin:0;line-height:1.7}
.scenario-connection-state svg{width:18px;height:18px;flex-shrink:0}
.scenario-decision{padding:0 0 15px;border-bottom:1px solid var(--line)}
.scenario-decision summary{font-size:12px;line-height:1.7;padding:7px 0 7px 29px;color:var(--muted);cursor:pointer}
.scenario-decision details[open]{display:flex;flex-direction:column;gap:12px}
.scenario-decision details[open] .field{margin:12px 0}
.scenario-preview{padding:0 0 18px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.scenario-preview strong,.scenario-preview-item>strong{font-size:15px;font-weight:650}
.scenario-preview p,.scenario-preview-item p{font-size:13px;line-height:1.8;margin:8px 0}
.scenario-preview .scenario-data-time{font-size:11px;margin:16px 0 0}
.scenario-preview-item{padding:13px 0;border-bottom:1px solid var(--line)}
.scenario-preview-item:first-child{padding-top:0}
.scenario-preview-item:last-child{border:0}
.scenario-metrics{margin:10px 0 0;display:grid;gap:9px}
.scenario-metrics>div{display:grid;gap:2px}
.scenario-metrics dt{font-size:12px;color:var(--muted)}
.scenario-metrics dd{margin:0;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
.scenario-auth-value{font-size:16px;line-height:1.7;margin:18px 0}
.scenario-next{padding:15px 0;color:var(--accent);font-size:14px;line-height:1.7;border-top:1px solid var(--line)}
.scenario-settings{margin:22px 0}
.scenario-settings>summary{font-size:14px;line-height:1.8;min-height:44px;cursor:pointer}
.scenario-step .follow-fields{margin:0;gap:14px}
.scenario-step .secondary.full{width:100%;white-space:normal}
.follow-idea{align-items:center;padding:25px 0}
.follow-idea-icon,.follow-idea>svg{margin-top:0}
@media(max-width:360px){.scenario-step h2{font-size:18px}.scenario-step-actions{gap:8px}.scenario-step-actions button{padding-left:12px;padding-right:12px}.scenario-step .field input,.scenario-step .field select{font-size:13px}}

.source-bubble.scenario-step{width:100%;max-width:100%;background:#fff;padding:18px 4px 22px;border-radius:0}
.source-bubble.scenario-history{width:100%;max-width:100%;background:#fff;padding:12px 4px;border-radius:0}

</style>

function sourceRoleKey(){return ({'CEO':'executive','大区经理':'regional','项目经理':'project','运营中心':'operations'})[data.role]||'executive'}

function getNexusContext(){return currentRole().data}
function nexusFollowup(){
  const d=getNexusContext(),w=d.weeklyOutput||{};
  const comparable=Number.isFinite(w.total)&&Number.isFinite(w.previousTotal)&&w.previousTotal>=0;
  const decline=comparable&&w.total<w.previousTotal;
  const idle=(Array.isArray(d.anomalies)?d.anomalies:[]).some(a=>(Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)||a.isLowAttendance===true);
  if(decline)return '**想先从分析产值下降开始吗？**或者你可以直接交代我其他事情。';
  if(idle)return '**想先从这些低出勤或闲置项目开始吗？**或者你可以直接交代我其他事情。';
  if(comparable&&w.total>w.previousTotal)return '**想先从了解产值增长开始吗？**或者你可以直接交代我其他事情。';
  return '**想先从各项目的经营情况开始吗？**或者你可以直接交代我其他事情。';
}
function nexusFocusOptions(){
  const d=getNexusContext(),w=d.weeklyOutput||{};
  const decline=Number.isFinite(w.total)&&Number.isFinite(w.previousTotal)&&w.total<w.previousTotal;
  const idle=(Array.isArray(d.anomalies)?d.anomalies:[]).some(a=>(Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)||a.isLowAttendance===true);
  const briefing={title:'帮我分析一下上周的情况',subtitle:'看看为什么上周的产值上升或者下降了',key:'briefing'};
  const safety={title:idle?'帮我找找异常项目':'查看设备出勤',subtitle:idle?'我能帮你找出低出勤/设备有比较多闲置的项目':'我会按项目整理设备出勤情况',key:'safety'};
  return decline?[briefing,safety]:idle?[safety,briefing]:[briefing,safety];
}
function nexusOverviewText(){
  const d=getNexusContext(),count=d.scope.projectCount,w=d.weeklyOutput||{},lines=[];
  const money=n=>(n>=10000?(n/10000).toLocaleString('zh-CN',{maximumFractionDigits:2})+'万':n.toLocaleString('zh-CN',{maximumFractionDigits:2}))+({CNY:'元',IDR:'印尼盾',USD:'美元'}[w.currency]||w.currency||'元');
  let overview=Number.isSafeInteger(count)&&count>=0?'你管理 **'+count+'个项目**':'';
  const role=sourceRoleKey();
  if(role==='regional')overview='你负责的 **'+d.scope.regionName+'大区** 有 **'+count+'个项目**';
  if(role==='project')overview='你负责的 **'+d.scope.projectName+'项目**';
  if(role==='operations')overview='已汇总 **'+count+'个项目**';
  if(Number.isFinite(w.total)&&w.total>=0){
    overview+=(overview?'，':'')+'上周产值 **'+money(w.total)+'**';
    if(Number.isFinite(w.previousTotal)&&w.previousTotal>=0){
      const delta=w.total-w.previousTotal;
      if(delta===0)overview+='，**环比持平**';
      else overview+='，环比 **'+(delta>0?'+':'−')+money(Math.abs(delta))+(w.previousTotal>0?'（'+(Math.abs(delta)/w.previousTotal*100).toFixed(1)+'%）':'')+'**';
    }
  }
  if(overview)lines.push(overview+'。');
  const valid=(Array.isArray(d.anomalies)?d.anomalies:[]).filter(a=>typeof a.projectName==='string'&&((Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)||a.isLowAttendance===true));
  if(valid.length){
    const a=valid[0],parts=[];
    if(Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)parts.push('有 **'+a.idleAssets+'台设备闲置**');
    if(Number.isFinite(a.attendanceRate)&&a.attendanceRate>=0&&a.attendanceRate<=100)parts.push('出勤率 **'+a.attendanceRate+'%**');
    lines.push('**'+a.projectName+'** '+(parts.length?parts.join('，'):'存在低出勤情况')+(valid.length>1?'；另有 **'+(valid.length-1)+'个项目** 需关注':'')+'。');
  }else if(d.anomaliesComplete===true)lines.push('本期未发现闲置或低出勤异常。');
  if((sourceRoleKey())==='operations'&&d.dataReviewCount>0)lines.push('其中 **'+d.dataReviewCount+'个项目** 的台班记录需核对。');
  lines.push(nexusFollowup());
  return lines.join('\n');
}

function bindSourceVoice(){const mic=document.getElementById('sourceVoice'),input=document.getElementById('draft'),status=document.getElementById('sourceVoiceStatus'),label=document.getElementById('sourceVoiceLabel');if(!mic)return;const reset=()=>{label.textContent='按住说话';sourceRecognition=null;sourceHolding=false;mic.classList.remove('is-listening');mic.setAttribute('aria-pressed','false');mic.setAttribute('aria-label','按住说话')};const start=()=>{if(sourceRecognition)return;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){status.textContent='当前环境暂不支持语音输入，请使用键盘输入。';sourceHolding=false;return}const recognition=new Speech();sourceRecognition=recognition;recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;const before=input.value.trim();recognition.onstart=()=>{if(!sourceHolding){recognition.stop();return}label.textContent='松开结束';mic.classList.add('is-listening');mic.setAttribute('aria-pressed','true');mic.setAttribute('aria-label','松开结束录音');status.textContent='正在聆听…松开结束'};recognition.onresult=e=>{let heard='';for(let i=0;i<e.results.length;i++)heard+=e.results[i][0].transcript;input.value=before+(before&&heard?' ':'')+heard;syncSourceDraft();status.textContent='文字已放入输入框，确认后发送。'};recognition.onerror=e=>{reset();status.textContent=['not-allowed','service-not-allowed'].includes(e.error)?'无法使用麦克风，请允许麦克风权限后重试。':e.error==='no-speech'?'没有听清，请按住麦克风再说一次。':e.error==='audio-capture'?'未找到可用的麦克风，请检查设备。':'语音输入暂不可用，请稍后重试或使用键盘输入。'};recognition.onend=()=>{reset();if(status.textContent.startsWith('正在聆听'))status.textContent='已停止语音输入。'};try{recognition.start()}catch{reset();status.textContent='无法开始语音输入，请重试。'}};const end=()=>{sourceHolding=false;if(sourceRecognition){try{sourceRecognition.stop()}catch{}}};mic.addEventListener('pointerdown',e=>{e.preventDefault();sourceHolding=true;start()});['pointerup','pointercancel','pointerleave'].forEach(t=>mic.addEventListener(t,end));mic.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();sourceHolding=true;start()}});mic.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();end()}});mic.addEventListener('click',e=>e.preventDefault())}
function message(m){if(m.type==='user')return `<div class="source-message-row from-user"><div class="source-bubble">${esc(m.text)}</div></div>`;let content='';if(m.type==='anomaly')content=`<h2 class="answer-heading">SCM 的问题，主要在设备闲置。</h2><p>今日出勤率为 <strong>64%</strong>，距离目标还差 16 个百分点。建议先核实闲置原因，再确定设备调配安排。</p><div class="insight"><h3>SCM · 今日设备情况</h3><div class="metric-pair"><div><strong>64<span style="font-size:17px">%</span></strong><small>设备出勤率</small></div><div><strong>6 <span style="font-size:17px">台</span></strong><small>闲置设备</small></div></div><p class="muted" style="font-size:12px">是否因作业面不足或设备待修，仍需项目经理确认。</p></div><div class="sources">${source('SCM 设备出勤明细','f2')}</div><p>我可以帮你持续跟踪，恢复或逾期时再提醒你。</p><div class="actions">${btn(hasScm()?'查看跟踪目标':'持续跟踪这件事',hasScm()?'goal':'track',hasScm()?.id||'scm','primary')}${btn('分享异常卡片','share','scm')}</div>`;else if(m.type==='tracked')content=`<p>好，已开始跟踪 <strong>${esc(m.title)}</strong>。后续有关键变化，我会在这里告诉你。</p><div class="actions">${btn('查看跟踪目标','goal',m.id,'quiet-action')}</div>`;else if(m.type==='prepare'){const {e,points}=prepData(m.event||'e1'),f=ensurePrep(e.id);content=`<h2 class="answer-heading">${esc(e.title)}，建议先对齐这些事。</h2><ol class="bullets">${points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol><p>${e.id==='e1'?'上次周会的安全整改已完成复核，不必重复讨论。':'会前确认关键事实，会后把结论和待办继续跟进。'}</p><div class="sources">${e.id==='e1'?source('上次周会记录','f3')+source('华东回款计划','f4'):e.id==='e2'?source('SCM 设备出勤明细','f2'):e.id==='e3'?source('华东回款计划','f4'):''}</div><div class="actions">${btn('查看完整会前简报','file',f.id,'primary')}${btn('查看会议','event',e.id)}</div>`}else if(m.type==='summary')content=`<h2 class="answer-heading">会议整理好了。</h2><p>已整理出会议纪要和 <strong>2 项待办</strong>，录音已存入资料库。</p><div class="sources">${source('本次会议纪要',m.file)}</div><div class="actions">${btn('确认会后待办','postTasks',m.file,'primary')}${btn('查看录音与纪要','file',m.file)}</div>`;else if(m.type==='progress')content=`<h2 class="answer-heading">你正在跟踪 ${data.goals.filter(g=>g.status==='active').length} 件事。</h2>${data.goals.filter(g=>g.status==='active').map(g=>`<button class="brief-row" data-action="goal" data-id="${g.id}"><span><strong>${esc(g.title)}</strong><p>${esc(g.summary)}</p></span><span class="chevron">${icon('right')}</span></button>`).join('')}`;else if(m.type==='update')content=`<p><strong>${esc(m.title)}</strong>有新进展：${esc(m.text)}</p><div class="actions">${btn('查看更新','goal',m.id,'quiet-action')}</div>`;else if(m.type==='answer')content=`<p>${esc(m.text).replace(/\n/g,'<br>')}</p>${m.file?`<div class="sources">${source(data.files.find(f=>f.id===m.file)?.title||'引用资料',m.file)}</div>`:''}<div class="actions">${btn('继续看目标进展','progress','','quiet-action')}${btn('查看资料库','tab','library')}</div>`;return `<div class="source-message-row"><div class="source-bubble rich-bubble">${content}</div></div>`}

function onboarding(){const n=ui.onboardStep;return `<section class="onboarding"><span class="onboarding-step">${n+1} / 3</span>${n===0?`<img src="${LOGO}" alt="Snack"><h1>你好，我是 Snack。</h1><p>从你的工作开始，慢慢了解你。</p><label class="field"><span>你的角色</span><select id="onboardRole">${['CEO','大区经理','项目经理'].map(r=>`<option ${ui.onboardRole===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field"><span>你想怎么称呼我？</span><input id="onboardName" value="${esc(data.name)}" maxlength="20"></label>${btn('继续','onboardNext','','primary full')}`:n===1?`<h1>先关注哪些事情？</h1><p>之后也可以随时在聊天里调整。</p><div>${['项目经营异常','设备出勤与闲置','回款与资金安排'].map((x,i)=>`<button class="option-button selected" role="checkbox" aria-checked="true" data-action="interest" data-id="${i}"><span>${x}</span>${icon('check')}</button>`).join('')}</div>${btn('继续','onboardNext','','primary full')}`:`<img src="${LOGO}" alt=""><h1>明早 ${esc(data.settings.briefTime)}，<br>先看一份经营简报。</h1><p>关键变化我会及时告诉你。你也可以随时问我。</p><div class="info-row"><span>Nexus 经营数据</span><span class="small-tag green">已连接 · 演示</span></div><div class="info-row"><span>钉钉日历</span><span class="small-tag green">已连接 · 演示</span></div>${btn('开始聊聊','finishOnboard','','primary full')}`}</section>`}
function postSpecs(id){const f=data.files.find(f=>f.id===id),eventId=f?.eventId||'e1',e=data.events.find(e=>e.id===eventId);return eventId==='e1'?[['确认 SCM 闲置设备调配安排','今天 17:00'],['核对华东项目本周回款','今天 18:00']]:eventId==='e2'?[['确认 SCM 闲置设备原因','今天 17:00'],['落实 SCM 调配负责人及恢复时间','明天 10:00']]:eventId==='e3'?[['核对华东回款到账情况','明天 12:00'],['确认剩余款项付款时间','明天 18:00']]:[['确认「'+(e?.title||'本次会议')+'」会议结论','会后'],['落实「'+(e?.title||'本次会议')+'」后续行动','会后']]}
function showSheet(type,params={}){stash();lastFocus=document.activeElement;ui.sheet={type,...params};paintSheet()}
function closeSheet(restore=true){if(recordTimer){clearInterval(recordTimer);recordTimer=null}ui.recordStart=null;ui.sheet=null;document.querySelector('.overlay')?.remove();if(restore){if(lastFocus?.isConnected)lastFocus.focus();else app.querySelector('.topbar button')?.focus()}}
function paintSheet(){document.querySelector('.overlay')?.remove();if(!ui.sheet)return;const s=ui.sheet;let title='',content='';const g=data.goals.find(g=>g.id===s.id);if(s.type==='track'||s.type==='newGoal'){title=s.type==='track'?'持续跟踪 SCM':'新建跟踪目标';content=`<form id="goalForm" class="form"><label class="field"><span>目标</span><input name="title" required maxlength="60" value="${s.type==='track'?'SCM 设备出勤恢复至 80%':''}" placeholder="想持续关注哪件事？"></label><label class="field"><span>完成条件</span><textarea name="condition" required placeholder="怎样才算完成？">${s.type==='track'?'设备出勤率恢复至 80%，并连续保持 3 天':''}</textarea></label><label class="field"><span>截止日期</span><input name="date" type="date" required value="2026-11-16" min="2026-11-12"></label><label class="field"><span>什么时候提醒你</span><select name="rule"><option>关键变化或逾期时提醒</option><option>每天 09:30 汇报进展</option><option>仅完成时提醒</option></select></label><button class="primary full" type="submit">确认并开始跟踪</button></form>`}else if(s.type==='updateGoal'){title='补充进展';content=`<form id="updateForm" class="form"><label class="field"><span>${esc(g?.title)}</span><textarea name="update" required placeholder="记录最新情况、反馈或下一步…" maxlength="500"></textarea></label><button class="primary full" type="submit">保存进展</button></form>`}else if(s.type==='goalMenu'){title='目标操作';content=btn(icon('check')+' 标记完成','completeGoal',s.id,'sheet-choice')+btn(icon('edit')+' 补充进展','updateGoal',s.id,'sheet-choice')+btn(icon('share')+' 分享目标','share',s.id,'sheet-choice')}else if(s.type==='history'){title='历史对话';content=`${btn(icon('plus')+' 新对话','newChat','','sheet-choice')}<div class="section-line"><h2>最近</h2></div>${data.history.length?data.history.map(h=>btn(`<span>${esc(h.title)}<small>11 月 12 日 · ${h.messages.length} 条消息</small></span>${icon('right')}`,'loadHistory',h.id,'sheet-choice')).join(''):'<p class="sheet-desc">新建对话后，当前聊天会保存在这里。</p>'}${btn('<span>今天的经营简报<small>每日简报 · 09:30</small></span>'+icon('right'),'scene','brief','sheet-choice')}`}else if(s.type==='rename'){title='秘书名称';content=`<form id="renameForm" class="form"><label class="field"><span>名称</span><input name="name" required maxlength="20" value="${esc(data.name)}"></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='editMemory'){title='编辑记忆';content=`<form id="memoryForm" class="form"><label class="field"><span>身份角色</span><select name="role">${['CEO','大区经理','项目经理'].map(r=>`<option ${r===data.role?'selected':''}>${r}</option>`).join('')}</select></label><label class="field"><span>背景与偏好</span><textarea name="memory" required maxlength="1000" style="min-height:150px">${esc(data.memory)}</textarea></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='briefTime'){title='简报时间';content=`<form id="timeForm" class="form"><label class="field"><span>每天发送时间</span><input type="time" name="time" required value="${esc(data.settings.briefTime)}"></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='connect'){const name=({nexus:'Nexus 经营数据',calendar:'钉钉日历',group:'项目群消息'})[s.id];title=name;content=`<p class="sheet-desc">${data.settings[s.id]?'已连接。可以读取与你角色相关的演示资料。断开后，原型将停止使用这个来源。':'连接后，Snack 可以结合相关信息准备简报和跟踪变化。'}</p><div class="info-row"><span>连接方式</span><span>原型模拟，不访问真实账号</span></div>${btn(data.settings[s.id]?'断开演示连接':'模拟连接','confirmConnect',s.id,'primary full')}`}else if(s.type==='attach'||s.type==='libraryAdd'){title=s.type==='attach'?'添加到对话':'添加资料';content=`${btn(icon('upload')+'<span>上传本地文件<small>仅保留名称，不上传文件内容</small></span>'+icon('right'),'pickFile','','sheet-choice')}${btn(icon('library')+'<span>从资料库选择</span>'+icon('right'),'chooseFile','','sheet-choice')}${s.type==='libraryAdd'?btn(icon('link')+'<span>同步 Nexus 项目资料<small>使用演示资料</small></span>'+icon('right'),'syncFiles','','sheet-choice'):''}<input id="fileInput" type="file" hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.mp3,.wav,.m4a,.png,.jpg">`}else if(s.type==='chooseFile'){title='选择资料';content=data.files.map(f=>btn(`<span>${esc(f.title)}<small>${esc(f.kind)}</small></span>${icon('plus')}`,'attachFile',f.id,'sheet-choice')).join('')}else if(s.type==='addEvent'||s.type==='editEvent'){const e=data.events.find(e=>e.id===s.id)||{title:'',date:ui.day,time:'15:00',end:'16:00',location:'线上会议 · 钉钉',desc:'',people:'你'};title=s.type==='addEvent'?'添加日程':'编辑日程';content=`<form id="eventForm" class="form"><label class="field"><span>日程名称</span><input name="title" required maxlength="60" value="${esc(e.title)}" placeholder="例如：项目经营复盘"></label><label class="field"><span>日期</span><input name="date" type="date" value="2026-11-${String(e.date).padStart(2,'0')}" required min="2026-11-09" max="2026-11-15"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1"><span>开始</span><input name="time" type="time" value="${e.time}" required></label><label class="field" style="flex:1"><span>结束</span><input name="end" type="time" value="${e.end}" required></label></div><label class="field"><span>地点</span><input name="location" value="${esc(e.location)}" required></label><label class="field"><span>议题</span><textarea name="desc" placeholder="准备讨论什么？">${esc(e.desc)}</textarea></label><p id="eventError" role="alert" style="font-size:12px;color:var(--red)"></p><button type="submit" class="primary full">保存日程</button></form>`}else if(s.type==='record'){title='会议录音';content=`<div class="recording"><span class="small-tag orange">模拟录音 · 不使用麦克风</span><div class="record-time" id="recordTime">00:00</div><div class="wave">${Array.from({length:26},(_,i)=>`<i style="height:${12+i*13%29}px;animation-delay:${i*.08}s"></i>`).join('')}</div><p>${esc(data.events.find(e=>e.id===s.id)?.title||'会议录音')}</p></div>${btn(icon('stop')+' 结束并生成纪要','stopRecord',s.id,'primary full')}`}else if(s.type==='generating'){title='正在整理会议';content='<p class="sheet-desc">录音已结束，正在生成演示纪要和待办。</p><div class="loading-line"></div>'}else if(s.type==='postTasks'){title='确认会后待办';const specs=postSpecs(s.id),f=data.files.find(f=>f.id===s.id);content=`<p class="sheet-desc">确认后加入日程待办，已确认过的事项不会重复添加。</p><form id="postForm" class="form">${specs.map(([title,time],i)=>`<label class="sheet-choice"><input type="checkbox" name="item${i}" checked><span>${esc(title)}<small>${esc(time)} · 我负责</small></span></label>`).join('')}${!f?.eventId||['e1','e2'].includes(f.eventId)?'<label style="display:flex;gap:10px;font-size:12px;align-items:center"><input type="checkbox" name="track" checked>同时持续跟踪 SCM 出勤恢复</label>':''}<button type="submit" class="primary full">确认待办</button></form>`}else if(s.type==='share'){title='分享';const file=data.files.find(f=>f.id===s.id),goal=data.goals.find(g=>g.id===s.id);content=`<div class="share-preview"><span class="small-tag orange">Snack · 演示卡片</span><h3>${esc(file?.title||goal?.title||'SCM 设备出勤异常')}</h3><p>${esc(file?.summary||goal?.summary||'今日出勤率 64%，6 台设备闲置，建议核实原因与调配安排。')}</p></div><p class="sheet-desc">选择渠道预览后续流程，不会发送真实消息。</p>${btn('<span>钉钉</span>'+icon('right'),'shareTarget','钉钉','sheet-choice')}${btn('<span>微信</span>'+icon('right'),'shareTarget','微信','sheet-choice')}`}else if(s.type==='shareTarget'){title=`分享到${s.target}`;const obj=data.files.find(f=>f.id===s.sharedId)||data.goals.find(g=>g.id===s.sharedId)||{title:'SCM 设备出勤异常',summary:'今日出勤率 64%，6 台设备闲置。请确认原因及恢复安排。'};content=`<div class="share-preview"><h3>项目运营群</h3><p><strong>${esc(obj.title)}</strong><br>${esc(obj.summary)}</p></div><p class="sheet-desc">这是分享流程演示。确认后将模拟跟踪群内反馈，不会发送真实消息。</p>${btn('模拟分享','shareDone',s.target,'primary full')}`}else if(s.type==='shareDone'){title='分享流程演示';const sharedGoal=data.goals.find(g=>g.id===s.sharedId)||(s.sharedId==='scm'?hasScm():null);content=`<div class="success-icon">${icon('check')}</div><p class="center">已模拟分享到项目运营群</p><p class="sheet-desc center" style="margin:12px 0 20px">${data.settings.group?'Snack 会结合群内反馈持续更新跟踪目标。':'群里还没有 Snack，可以模拟添加机器人，接收后续反馈。'}</p>${btn(data.settings.group?(sharedGoal?'查看跟踪目标':'完成'):'模拟添加 Snack 机器人',data.settings.group?(sharedGoal?'goal':'close'):'addBot',sharedGoal?.id||'','primary full')}${btn('稍后再说','close','','secondary full')}`}else if(s.type==='voice'){title='语音输入';content=`<div class="recording"><span class="small-tag orange">语音交互演示</span><div class="wave">${Array.from({length:20},(_,i)=>`<i style="height:${12+i*7%25}px;animation-delay:${i*.09}s"></i>`).join('')}</div><p>不启用麦克风，演示语音转文字。</p></div>${btn('使用示例语音','voiceResult','','primary full')}`}else if(s.type==='about'){title='关于这个原型';content='<p class="sheet-desc">参考 Muse 的聊天、目标、时间安排和资料产物分工，以及 Nexus × Snack 的业务方案。</p><p class="sheet-desc">业务数据、AI 回复、会议录音、通知及外部连接均为交互演示。聊天语音沿用原型中的浏览器语音识别，需允许麦克风权限；不会发送真实业务消息。浏览器保存的状态可随时重置。</p>'+btn('了解了','close','','primary full')}else if(s.type==='reset'){title='恢复初始演示？';content='<p class="sheet-desc">会清空当前浏览器中新增的对话、目标、资料名称和设置，恢复初始示例。这个操作无法撤销。</p>'+btn('恢复初始演示','confirmReset','','primary full')+btn('取消','close','','secondary full')}
const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheetTitle">${title}</h2>${ib('关闭弹窗','close','close')}</div>${content}</section>`;app.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay&&s.type!=='generating')closeSheet()});overlay.querySelector('.sheet').focus();}
function toast(t){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;app.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2600)}
function scrollBottom(){requestAnimationFrame(()=>{const el=document.getElementById('scroll');if(el)el.scrollTop=el.scrollHeight})}
function hasScm(){return data.goals.find(g=>g.project==='SCM')}
function archive(){if(data.messages.length)data.history.unshift({id:'h'+Date.now(),title:data.messages.find(m=>m.type==='user')?.text||'项目经营沟通',messages:structuredClone(data.messages),fresh:ui.fresh});data.history=data.history.slice(0,10)}
function addUser(text){data.messages.push({type:'user',text});save()}
function answer(m){data.messages.push(m);save();ui.loading=false;render()}
function reply(m,delay=600){ui.loading=true;render();clearTimeout(responseTimer);responseTimer=setTimeout(()=>answer(m),delay)}
function pushChat(text,m){closeSheet(false);ui.page='main';ui.tab='chat';ui.previous=null;if(text)addUser(text);reply(m)}
function makeScm(overrides={}){if(hasScm())return hasScm();const g={id:'g'+Date.now(),title:'SCM 设备出勤恢复至 80%',project:'SCM',status:'active',progress:64,condition:'设备出勤率恢复至 80%，并连续保持 3 天',rule:'关键变化或逾期时提醒',date:'2026-11-16',summary:'今日出勤率 64%，6 台闲置设备待确认调配安排。',logs:[['今天 09:41','从经营异常分析开始跟踪，等待项目经理反馈。']],...overrides};data.goals.unshift(g);save();return g}
function prepData(event){const e=data.events.find(e=>e.id===event)||data.events[0];const points=e.id==='e1'?['SCM 闲置设备：确认原因、调配安排和恢复时间。','创新项目出勤：确认新增作业面的落实进度。','华东项目回款：核对尚未确认的 1 笔款项。']:e.id==='e2'?['核实 6 台闲置设备的具体原因。','确认可调配设备和负责人。','约定出勤恢复时间与下一次检查。']:e.id==='e3'?['核对已确认的 2 笔回款。','落实剩余 1 笔款项的预计付款时间。','复核大区设备利用情况与后续安排。']:[e.desc||'明确本次会议议题。','确认每个议题的负责人和需要决策的问题。','会后记录结论、行动和完成时间。'];return {e,points}}
function ensurePrep(event){const {e,points}=prepData(event),id='prep-'+e.id;let f=data.files.find(f=>f.id===id);if(!f){f={id,title:e.title+' · 会前简报',kind:'报告',folder:'reports',meta:'今天 09:41 · Snack 生成',summary:e.desc||'整理本次会议的议题与待确认事项。',points};data.files.unshift(f)}save();return f}
function addPrep(event){const f=ensurePrep(event);pushChat('帮我准备这次会议。',{type:'prepare',event,file:f.id})}

function submitChat(){const input=document.getElementById('draft'),text=input?.value.trim();if(!text)return;if(!ui.reference){sourceReply(text);return}if(ui.loading){toast('正在整理上一条回复');return}const file=ui.reference;ui.draft='';ui.reference=null;addUser(text);let m;if(file){const f=data.files.find(x=>x.id===file);m={type:'answer',file,text:f?.uploaded?'已把这份文件关联到对话。原型只记录文件名，未读取内容。你可以用示例资料继续体验分析与追踪。':`结合《${f?.title}》，当前重点是：\n${f?.summary}\n\n建议确认负责人和预计完成时间，再把需要跨会议跟进的事项设为持续目标。`}}else if(/SCM|闲置|出勤|异常|最需要/.test(text))m={type:'anomaly'};else if(/周会|会前|会议/.test(text)){ensurePrep('e1');m={type:'prepare',event:'e1'}}else if(/目标|进展|跟踪/.test(text))m={type:'progress'};else if(/经营|本周|简报/.test(text))m={type:'answer',file:'f1',text:'本周经营总体平稳，主要关注设备出勤与回款。\nSCM 和创新项目出勤低于目标，华东还有 1 笔回款待确认。安全整改已完成复核。\n建议把本次周会重点放在设备调配与剩余回款安排。'};else m={type:'answer',text:'这是交互原型，我先记下这条消息。当前可以演示：分析 SCM 异常、准备项目周会、查询目标进展，以及结合资料继续提问。'};reply(m)}

  if(s.type==='disconnectDing'){workSheet('断开钉钉？','<p class="sheet-desc">停止获取新的日程、会议记录和项目消息。已经启动的事项和历史资料会保留。</p>'+btn('断开连接','disconnectDing','','primary full')+btn('取消','close','','secondary full'));return}

};
const commitPostItems=confirmPostItems;
confirmPostItems=function(fid,items){if(!hasDingScopes('post')){beginActivation('post','meeting',{fid,items});return []}return commitPostItems(fid,items)};
const respondBeforeActivation=respondToChat;
respondToChat=function(text,key){
  if(/周会|会前|准备会议/.test(text||'')&&(!data.calendarAssistants.before||!data.events.some(e=>e.type==='meeting'))){beginActivation('calendar','before');return}
  if(!ui.goalReference&&/持续|帮我盯|跟进这/.test(text||'')){beginActivation('goal','risk',{title:text});return}
  respondBeforeActivation(text,key);
};
sourceReply=respondToChat;
const makeScmBeforeActivation=makeScm;
makeScm=function(overrides={}){const existing=hasScm();if(existing)return existing;beginActivation('goal','risk',{project:'SCM',...overrides});return null};
sourcesPage=function(){return `<section class="page"><div class="page-title"><h1>数据来源</h1></div>${settingRow('Nexus 经营数据',data.settings.nexus?'已连接':'已断开','connect','nexus')}${settingRow('钉钉',data.dingTalk.cliConnected?(data.dingTalk.scopes.length?'已连接 · 已授权':'已连接 · 待授权'):'未连接','dingConnection')}<div class="source-notice">交互演示，不访问真实账号</div></section>`};
const handleBeforeActivation=handle;
handle=function(action,id,el){
  if(action==='addBot'){beginActivation('provider');return}
  if(action==='assistantActivity'){showSheet('assistantActivity');return}
  if(action==='startTemplate'){beginActivation('goal',id);return}
  if(action==='activateCalendar'||action==='calendarScenarios'){showSheet('calendarScenarios');return}
  if(action==='calendarScenario'){beginActivation('calendar',id);return}
  if(action==='record'&&!data.calendarAssistants.during){beginActivation('calendar','during',{eventId:id});return}
  if(action==='postTasks'&&!data.calendarAssistants.after){beginActivation('calendar','after',{fileId:id});return}
  if(action==='prepare'&&!data.calendarAssistants.before){beginActivation('calendar','before',{eventId:id});return}
  if(action==='activationConnect'){connectActivation(id);return}
  if(action==='activationAuthorize'){authorizeActivation(id);return}
  if(action==='activationFinish'){startActivation({},id);return}
  if(action==='showTemplates'||action==='newGoal'){showSheet('templates');return}
  if(action==='track'||action==='discussScm'||action==='draftGoal'){const g=hasScm();if(g&&action==='discussScm'){handleBeforeActivation('askGoal',g.id);return}beginActivation('goal',id==='会议决定'?'meeting':'risk',id==='scm'?{project:'SCM'}:null);return}
  if(action==='dingConnection'||(action==='connect'&&['calendar','group'].includes(id))){if(data.dingTalk.cliConnected&&data.dingTalk.scopes.length)showSheet('disconnectDing');else beginActivation('provider');return}
  if(action==='disconnectDing'){data.dingTalk={cliConnected:false,scopes:[]};data.settings.calendar=false;data.settings.group=false;data.settings.dingTalk=false;save();closeSheet(false);render();toast('钉钉已断开');return}
  if(action==='confirmConnect'&&['calendar','group'].includes(id)){beginActivation('provider');return}
  if(action==='prepare'&&!data.events.some(e=>e.id===id)){beginActivation('calendar');return}
  if(action==='scene'&&id==='meeting'){go('calendar');return}
  if(action==='addEvent'&&!data.calendarActivated){beginActivation('calendar');return}
  if(action==='shareDone'){const sharedId=ui.sheet?.sharedId;showSheet('shareDone',{sharedId});return}
  handleBeforeActivation(action,id,el);
};
const messageBeforeActivation=message;
message=function(m){
  if(m.type==='prepare'&&(!data.calendarAssistants.before||!data.events.some(e=>e.id===(m.event||'e1'))))
    return `<div class="source-message-row"><div class="source-bubble rich-bubble"><p>还没有可用的会议，先选择会议场景并连接钉钉日程。</p><div class="actions">${btn('选择会议场景','activateCalendar','','primary')}</div></div></div>`;
  return messageBeforeActivation(m);
};

document.addEventListener('submit',e=>{
  if(e.target.id!=='activationForm')return;
  e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(e.target),get=k=>String(fd.get(k)||'').trim();
  startActivation({project:get('project'),title:get('title'),condition:get('condition'),rule:get('rule')},get('token'));
},true);

function nextScenarioRun(d,now=new Date()){
  const local=new Date(now.getTime()+8*3600000),[h,m]=String(d.time||'09:00').split(':').map(Number);
  for(let i=0;i<8;i++){
    const candidate=new Date(Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate()+i,h,m));
    const day=candidate.getUTCDay();if(d.frequency==='weekdays'&&(day===0||day===6))continue;
    if(d.frequency==='weekly'&&day!==Number(d.weekday))continue;
    if(candidate.getTime()<=local.getTime())continue;
    return candidate.toISOString().slice(0,16)+'+08:00';
  }
  return '';
}

function scenarioAdvance(values={},token=followToken()){

    const m=scenarioMeetings().find(x=>x.id===d.meetingId);if(!m)return scenarioError(d,'请选择一场可用会议，或先连接钉钉会议记录。');

  }
  if(d.stage==='decisions'&&(!d.decisions.length||d.decisions.some(x=>!x.owner||!x.due||!x.evidence)))return scenarioError(d,'至少选择一项决策，并补齐负责人、检查日期和完成依据。');
  if(d.stage==='scope'){
    if(d.template==='brief'&&(!d.projects.length||!d.metrics.length))return scenarioError(d,'至少选择一个项目和一项经营指标。');
    if(d.template==='risk'&&(!d.project||!d.focus))return scenarioError(d,'请选择项目和关注重点，也可以补充自己的关注点。');

    d.resource=d.projects.join('、')+' 项目资料';
  }
  if(d.stage==='sources'){
    if(!['nexus','dingTalk','manual'].includes(d.sourceKey)||d.template==='brief'&&d.sourceKey!=='nexus')return scenarioError(d,'经营简报需要连接 Nexus 经营数据。');
    if(!scenarioSourceReady(d))return scenarioError(d,'先连接并授权所选数据源，再继续。');
    if(d.sourceKey==='dingTalk'&&d.resource!=='全部可见项目'&&!d.projects.every(p=>d.resource.includes(p)))return scenarioError(d,'资料范围需覆盖所选项目，请选择对应项目资料。');
  }
  if(d.stage==='preview'&&d.template==='risk'&&!d.criteria.trim())return scenarioError(d,'请补充重要变化的判断标准。');
  if(d.stage==='delivery'){

    if(d.channel==='dingtalk'&&!scenarioPushReady())return scenarioError(d,'先授权钉钉消息推送，或选择仅在 Snack 查看。');
    if(d.template==='brief'&&(!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.time)||!['daily','weekdays','weekly'].includes(d.frequency)||!/^[0-6]$/.test(d.weekday)))return scenarioError(d,'请设置有效的推送时间和频率。');
  }

  scenarioShow(stages[index+1]);return true;
}

goalDetail=function(){
  const g=data.goals.find(x=>x.id===ui.id);if(g?.flowVersion!==2)return goalDetailBeforeScenarios();const d=g.setupSnapshot;
  return `<section class="page follow-detail"><div class="detail-hero"><div class="detail-state">${icon(SCENARIOS[g.template].icon)}${g.status==='paused'?'已暂停':g.status==='done'?'已结束':g.template==='brief'?'定时简报':'持续跟进中'}</div><h1>${esc(g.title)}</h1></div>${g.template==='brief'&&g.status==='active'?`<div class="scenario-next">下次：${esc(scenarioRunLabel(g.nextCheck))}</div>`:''}${!scenarioSourceReady(d)?'<div class="source-offline">数据源已断开，暂停读取新的资料。</div>':''}${d.channel==='dingtalk'&&!scenarioPushReady()?'<div class="source-offline">钉钉推送授权已撤销。结果保留在 Snack，重新授权后恢复推送。</div>':''}<section class="latest-progress"><div class="section-line"><h2>${g.template==='brief'?'最近一次运行':'最新进展'}</h2><time>${esc(g.lastCheck)}</time></div><p>${esc(g.summary)}</p></section>${g.latestPreview||''}${g.template==='meeting'?`<div class="section-line"><h2>跟进的决策</h2></div>${d.decisions.map(x=>`<div class="scenario-preview-item"><strong>${esc(x.title)}</strong><p>${esc(x.owner)} · ${esc(x.due)}</p><p>完成依据：${esc(x.evidence)}</p></div>`).join('')}`:''}<details class="scenario-settings"><summary>已确认的设置</summary>${scenarioFields(d)}</details><div class="section-line"><h2>${g.template==='brief'?'运行记录':'进展记录'}</h2></div><div class="timeline">${g.logs.map(([t,c])=>`<div class="timeline-item"><time>${esc(t)}</time><p>${esc(c)}</p></div>`).join('')}</div>${g.status==='active'?btn(g.template==='brief'?'模拟生成并推送一次':'模拟检查新进展','scenarioRun',g.id,'secondary full'):''}</section>`;
};
const fileDetailBeforeScenarios=fileDetail;
fileDetail=function(){const f=data.files.find(x=>x.id===ui.id);if(!f?.scenarioReport)return fileDetailBeforeScenarios();return `<section class="page"><div class="detail-hero"><h1>${esc(f.title)}</h1><p>${esc(f.meta)}</p></div>${f.reportHtml}</section>`};
const goalSourceBeforeScenarios=goalSourceConnected;
goalSourceConnected=function(g){return g.flowVersion===2?scenarioSourceReady(g.setupSnapshot):goalSourceBeforeScenarios(g)};
const calendarConnectedBeforeScenarios=calendarConnected;
calendarConnected=function(provider){return provider==='dingtalk'?!!data.dingTalk?.cliConnected&&data.dingTalk.scopes.includes('calendar'):calendarConnectedBeforeScenarios(provider)};
const sourcesBeforeScenarios=sourcesPage;
sourcesPage=function(){return sourcesBeforeScenarios().replace('<div class="connector-list">','<div class="connector-list">'+settingRow('钉钉消息与资料',data.dingTalk.cliConnected?'已连接':'未连接','scenarioManageConnector'))};
const remindersBeforeScenarios=reminders;
reminders=function(){return `<section class="page">${settingRow('项目经营简报',String(data.goals.filter(g=>g.flowVersion===2&&g.template==='brief'&&g.status==='active').length)+' 项已开启','scenarioBriefList')}${switchRow('跟进事项有重要变化','alerts')}${switchRow('会前准备提醒','prep')}${switchRow('夜间免打扰','quiet')}${data.settings.quiet?'<div class="info-row"><span>免打扰时段</span><span>22:00 – 08:00</span></div>':''}</section>`};
const handleBeforeScenarios=handle;
handle=function(action,id='',el){
  const d=scenarioDraft();
  if(action==='postTasks'&&data.files.some(f=>f.id===id)){
    if(activeFollowDraft()){go('chat');toast('先完成或取消当前设置');return}
    go('chat');startFollowConversation('接着跟进这场会议的决策。','meeting');const draft=scenarioDraft();draft.meetingId=id;scenarioAdvance({meetingId:id},followToken(draft));return;
  }
  if(action==='scenarioBack'){scenarioCapture();scenarioBack(id);return}
  if(action==='scenarioConnect'){
    const parts=id.split(':'),token=parts.slice(0,2).join(':');if(!d||token!==followToken(d))return;scenarioCapture();scenarioAuthorize(parts[2],[parts[3]],token);return;
  }
  if(action==='scenarioConsent'){const a=ui.scenarioAuth;if(a?.id===id&&a.stage==='connect'&&a.draftToken===followToken()){a.stage='consent';paintSheet()}return}
  if(action==='scenarioGrant'){scenarioGrant(id);return}
  if(action==='scenarioAuthReturn'){const a=ui.scenarioAuth;if(a?.id===id&&a.draftToken===followToken()){closeSheet(false);d.error='';followRender()}return}
  if(action==='scenarioTest'){if(d&&id===followToken(d)&&scenarioPushReady()){scenarioCapture();d.testSent=true;save();render()}return}
  if(action==='scenarioRun'){scenarioRun(id);return}
  if(action==='scenarioManageConnector'){showSheet('scenarioConnector');return}
  if(action==='scenarioRevokePush'){data.dingTalk.scopes=data.dingTalk.scopes.filter(x=>x!=='messageSend');save();paintSheet();return}
  if(action==='scenarioBriefList'){go('goals');return}
  if(action==='editGoal'&&data.goals.find(g=>g.id===id)?.flowVersion===2){
    if(activeFollowDraft()){go('chat');toast('先完成或取消当前设置');return}
    const g=data.goals.find(x=>x.id===id);data.followSequence=(data.followSequence||0)+1;data.followDraft={...structuredClone(g.setupSnapshot),id:'scenario-'+Date.now().toString(36)+'-'+data.followSequence,revision:0,existingGoalId:g.id};ui.reference=null;ui.goalReference=null;ui.manualEventDraft=null;scenarioShow('review',data.followDraft);go('chat');return;
  }
  if(action==='followConfirm'&&d){scenarioConfirm(id);return}
  if(action==='followCancel'&&d){closeSheet(false)}
  handleBeforeScenarios(action,id,el);
  if(action==='resumeGoal'){const g=data.goals.find(x=>x.id===id);if(g?.flowVersion===2&&g.template==='brief'){g.nextCheck=nextScenarioRun(g.setupSnapshot);save();render()}}
};
document.addEventListener('submit',event=>{
  if(event.target.id!=='scenarioForm')return;event.preventDefault();event.stopImmediatePropagation();const d=scenarioDraft();if(!d)return;
  const token=new FormData(event.target).get('token');if(d.stage==='review')scenarioConfirm(token);else scenarioAdvance(scenarioValues(event.target),token);
},true);
document.addEventListener('change',event=>{
  const form=event.target.closest?.('#scenarioForm');if(!form||!scenarioDraft())return;scenarioCapture();
  if(['source','channel','frequency'].includes(event.target.name))render();
});
document.addEventListener('input',event=>{if(event.target.closest?.('#scenarioForm')&&scenarioDraft())scenarioCapture()});

const scrollBeforeScenarios=scrollBottom;
scrollBottom=function(){
  if(!scenarioDraft()||ui.page!=='main'||ui.tab!=='chat')return scrollBeforeScenarios();
  requestAnimationFrame(()=>{const pane=document.getElementById('scroll'),card=document.querySelector('.scenario-step'),header=document.querySelector('.source-topbar');if(!pane||!card?.getBoundingClientRect)return;const top=header?.getBoundingClientRect().bottom||pane.getBoundingClientRect().top;pane.scrollTop+=card.getBoundingClientRect().top-top-12;});
};

// END THREE SCENARIOS

render();
</script>
</body></html>

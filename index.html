  const valid=(Array.isArray(d.anomalies)?d.anomalies:[]).filter(a=>typeof a.projectName==='string'&&((Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)||a.isLowAttendance===true));
  if(valid.length){
    const a=valid[0],parts=[];
    if(Number.isSafeInteger(a.idleAssets)&&a.idleAssets>0)parts.push('有 **'+a.idleAssets+'台设备闲置**');
    if(Number.isFinite(a.attendanceRate)&&a.attendanceRate>=0&&a.attendanceRate<=100)parts.push('出勤率 **'+a.attendanceRate+'%**');
    lines.push('**'+a.projectName+'** '+(parts.length?parts.join('，'):'存在低出勤情况')+(valid.length>1?'；另有 **'+(valid.length-1)+'个项目** 需关注':'')+'。');
  }else if(d.anomaliesComplete===true)lines.push('本期未发现闲置或低出勤异常。');
  if((sourceRoleKey())==='operations'&&d.dataReviewCount>0)lines.push('其中 **'+d.dataReviewCount+'个项目** 的台班记录需核对。');
  lines.push(nexusFollowup());
  return lines.join('\n');
}

let sourceRecognition=null,sourceHolding=false;

function bindSourceVoice(){
  const mic=document.getElementById('sourceVoice'),input=document.getElementById('draft'),form=document.getElementById('chatForm'),status=document.getElementById('sourceVoiceStatus'),label=document.getElementById('sourceVoiceLabel');if(!mic)return;
  const reset=()=>{sourceRecognition=null;sourceHolding=false;form.classList.remove('is-recording');mic.classList.remove('is-listening');mic.setAttribute('aria-pressed','false');mic.setAttribute('aria-label','开始语音输入');label.textContent='开始语音输入';syncSourceDraft()};
  mic.addEventListener('click',()=>{
    if(sourceRecognition){sourceHolding=false;try{sourceRecognition.stop()}catch{reset()}return}
    const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Speech){status.textContent='当前环境暂不支持语音输入，请使用键盘输入。';return}
    const recognition=new Speech();sourceRecognition=recognition;sourceHolding=true;recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;const before=input.value.trim();
    form.classList.add('is-recording');mic.setAttribute('aria-label','停止语音输入');label.textContent='停止语音输入';mic.setAttribute('aria-pressed','true');status.textContent='正在开启麦克风…';
    recognition.onstart=()=>{if(!sourceHolding){recognition.stop();return}mic.classList.add('is-listening');status.textContent='正在聆听，点击麦克风结束。'};
    recognition.onresult=e=>{let heard='';for(let i=0;i<e.results.length;i++)heard+=e.results[i][0].transcript;input.value=before+(before&&heard?' ':'')+heard;syncSourceDraft();input.dispatchEvent(new Event('input',{bubbles:true}));status.textContent='文字已放入输入框，结束录音后可发送。'};
    recognition.onerror=e=>{reset();status.textContent=['not-allowed','service-not-allowed'].includes(e.error)?'无法使用麦克风，请允许麦克风权限后重试。':e.error==='no-speech'?'没有听清，请点击麦克风再说一次。':e.error==='audio-capture'?'未找到可用的麦克风，请检查设备。':'语音输入暂不可用，请稍后重试或使用键盘输入。'};
    recognition.onend=()=>{reset();if(status.textContent.startsWith('正在')||status.textContent.startsWith('文字已'))status.textContent=input.value.trim()?'文字已放入输入框，确认后发送。':'已停止语音输入。'};
    try{recognition.start()}catch{reset();status.textContent='无法开始语音输入，请重试。'}
  });
}

function fileRow(f){return f?`<button class="folder-row" data-action="file" data-id="${f.id}"><span class="file-icon ${f.kind==='录音'?'orange':f.kind==='文件'?'green':''}">${icon(f.kind==='录音'?'mic':f.kind==='知识库'?'library':'file')}</span><span class="file-info"><strong>${esc(f.title)}</strong><small>${esc(f.meta)}</small></span>${icon('right')}</button>`:''}
function library(){return `<section class="page">${ui.folder?`<div class="page-title"><h1>${esc(folders.find(f=>f[0]===ui.folder)?.[1]||'项目资料')}</h1></div>`:''}${ui.folder?btn('返回全部资料','folderBack','','linklike'):''}<label class="search">${icon('search')}<input id="librarySearch" aria-label="搜索资料" placeholder="搜索文件、录音、知识库" value="${esc(ui.query)}"></label><div class="filter-row" aria-label="资料类型">${['全部','项目笔记','知识库','文件'].map(t=>`<button class="${ui.filter===t?'selected':''}" data-action="fileFilter" data-id="${t}" aria-pressed="${ui.filter===t}">${t}</button>`).join('')}</div><div id="libraryResults">${libraryResults()}</div></section>`}
function libraryResults(){const files=data.files.filter(f=>(ui.filter==='全部'||f.kind===ui.filter||(ui.filter==='项目笔记'&&['录音','报告'].includes(f.kind)))&&(!ui.folder||f.folder===ui.folder)&&(!ui.query||f.title.toLowerCase().includes(ui.query.toLowerCase())));return `${!ui.folder&&!ui.query&&ui.filter==='全部'?`<div class="section-line"><h2>项目资料</h2></div>${folders.slice(0,2).map(([id,title])=>`<button class="folder-row" data-action="folder" data-id="${id}"><span class="file-icon orange">${icon('folder')}</span><span class="file-info"><strong>${title}</strong><small>${data.files.filter(f=>f.folder===id).length} 份资料</small></span>${icon('right')}</button>`).join('')}<div class="section-line"><h2>最近资料</h2><small>按更新时间</small></div>`:''}${files.length?files.map(fileRow).join(''):`<div class="empty">${icon('search')}<p>${ui.query?'没有找到相关资料':'这里还没有资料'}</p>${btn(ui.query?'清除搜索':'添加资料',ui.query?'clearSearch':'libraryAdd')}</div>`}`}
function fileDetail(){const f=data.files.find(f=>f.id===ui.id);if(!f)return '<div class="empty">资料不存在</div>';let points=f.id==='f2'||f.id==='synced'?['设备出勤率为 64%，低于目标 80%。','6 台设备闲置；具体原因需要项目经理确认。','结合台班与维修记录，确认可调配的设备。']:f.id==='f4'?['本期 3 笔计划回款，已确认 2 笔。','剩余 1 笔等待客户确认付款时间。','11 月 20 日前核对到账与相关凭证。']:f.id==='f5'?['出勤率低于 80% 时，先核实设备状态与排班。','区分待修、待调配、作业面不足等原因。','明确负责人和恢复时间，连续 3 天恢复后结束跟踪。']:f.points||['SCM 闲置设备：确认原因、调配安排与恢复时间。','创新项目出勤：跟进新增作业面的落实进展。','华东回款：确认剩余 1 笔款项的付款安排。'];return `<section class="page"><span class="small-tag">${esc(f.kind)}</span><div class="detail-hero" style="margin-top:15px"><h1>${esc(f.title)}</h1><div class="doc-meta">${esc(f.meta)} · 演示资料</div></div>${f.kind==='录音'?`<div class="player"><button aria-label="${ui.playing?'暂停演示播放':'演示播放'}" data-action="play">${icon(ui.playing?'pause':'play')}</button><div class="wave">${Array.from({length:38},(_,i)=>`<i style="height:${8+(i*17%18)}px"></i>`).join('')}</div><small id="playTime">${ui.playing?'播放演示':'00:00'}</small></div>`:''}<div class="doc-block"><h3>${f.kind==='录音'?'会议摘要':'概览'}</h3><p>${esc(f.summary)}</p></div>${f.uploaded?'<div class="doc-block"><p>此原型仅保留文件名，未上传或解析文件内容。</p></div>':`<div class="doc-block"><h3>${f.id==='f2'?'需要核实':'关键内容'}</h3><ul class="bullets">${points.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div class="doc-block"><h3>下一步</h3><p>${f.id==='f5'?'按照规范确认异常原因，并保留处理和复核记录。':'确认负责人、处理安排和预计完成时间；把需要跨会议跟进的事项加入持续目标。'}</p></div>${f.kind==='录音'?`<div class="actions">${btn('提取并确认待办','postTasks',f.id,'quiet-action')}</div>`:''}`}</section>`}

function settingRow(label,value,action,id=''){return `<button class="setting-row" data-action="${action}" data-id="${id}"><span>${label}</span><span class="value">${esc(value)}</span>${icon('right')}</button>`}
function switchRow(label,key){return `<div class="setting-row"><span>${label}</span><button class="switch ${data.settings[key]?'on':''}" role="switch" aria-checked="${data.settings[key]}" aria-label="${label}" data-action="toggle" data-id="${key}"></button></div>`}
function settings(){return `<section class="page"><div class="settings-profile"><img src="${LOGO}" alt="Snack"><div><h2>${esc(data.name)}</h2><p>${esc(currentRole().displayName)}的 AI 秘书</p></div></div><div class="settings-group"><h3>我的秘书</h3>${settingRow('秘书名称',data.name,'rename')}${settingRow('关于我的记忆',data.role,'memory')}${settingRow('主动提醒',data.settings.briefTime+' 早间简报','reminders')}${settingRow('数据来源','Nexus · 日历','sources')}</div><div class="settings-group"><h3>使用偏好</h3>${switchRow('关键变化主动提醒','alerts')}${switchRow('夜间免打扰','quiet')}${settingRow('汇报方式','先给结论，再给依据','memory')}</div><div class="settings-group"><h3>原型</h3>${settingRow('重新体验首次使用','','onboard')}${settingRow('关于这个原型','交互演示','about')}${settingRow('恢复初始演示','','reset')}</div></section>`}
function memory(){return `<section class="page"><div class="page-title"><h1>关于我的记忆</h1>${ib('编辑记忆','edit','editMemory')}</div><div class="info-row"><span>身份角色</span><span>${esc(data.role)}</span></div><div class="section-line"><h2>背景与偏好</h2></div><div class="memory-note">${esc(data.memory)}</div><div class="section-line"><h2>最近记住的事</h2></div><div class="timeline"><div class="timeline-item"><time>今天</time><p>持续跟进设备出勤与回款的关键变化。</p></div><div class="timeline-item"><time>首次使用</time><p>你希望先看结论，再查看详细依据。</p></div></div></section>`}
function sourcesPage(){return `<section class="page"><div class="page-title"><h1>数据来源</h1></div><p class="muted" style="font-size:12px;margin-bottom:18px">当前为连接状态演示，不会访问真实账号。</p>${settingRow('Nexus 经营数据',data.settings.nexus?'已连接':'未连接','connect','nexus')}${settingRow('钉钉日历',data.settings.calendar?'已连接':'未连接','connect','calendar')}${settingRow('项目群消息',data.settings.group?'已连接':'未连接','connect','group')}<div class="section-line"><h2>可用范围</h2></div><p style="font-size:13px">你的角色可见项目、设备出勤、回款资料与会议安排。每条分析保留关联资料入口。</p></section>`}
function reminders(){return `<section class="page"><div class="page-title"><h1>主动提醒</h1></div>${switchRow('每日经营简报','brief')}${settingRow('简报时间',data.settings.briefTime,'briefTime')}${switchRow('目标关键变化','alerts')}${switchRow('会前准备提醒','prep')}${switchRow('夜间免打扰','quiet')}<div class="info-row"><span>免打扰时段</span><span>22:00 – 08:00</span></div></section>`}
function onboarding(){const n=ui.onboardStep;return `<section class="onboarding"><span class="onboarding-step">${n+1} / 3</span>${n===0?`<img src="${LOGO}" alt="Snack"><h1>你好，我是 Snack。</h1><p>从你的工作开始，慢慢了解你。</p><label class="field"><span>你的角色</span><select id="onboardRole">${['CEO','大区经理','项目经理'].map(r=>`<option ${ui.onboardRole===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field"><span>你想怎么称呼我？</span><input id="onboardName" value="${esc(data.name)}" maxlength="20"></label>${btn('继续','onboardNext','','primary full')}`:n===1?`<h1>先关注哪些事情？</h1><p>之后也可以随时在聊天里调整。</p><div>${['项目经营异常','设备出勤与闲置','回款与资金安排'].map((x,i)=>`<button class="option-button selected" role="checkbox" aria-checked="true" data-action="interest" data-id="${i}"><span>${x}</span>${icon('check')}</button>`).join('')}</div>${btn('继续','onboardNext','','primary full')}`:`<img src="${LOGO}" alt=""><h1>明早 ${esc(data.settings.briefTime)}，<br>先看一份经营简报。</h1><p>关键变化我会及时告诉你。你也可以随时问我。</p><div class="info-row"><span>Nexus 经营数据</span><span class="small-tag green">已连接 · 演示</span></div><div class="info-row"><span>钉钉日历</span><span class="small-tag green">已连接 · 演示</span></div>${btn('开始聊聊','finishOnboard','','primary full')}`}</section>`}
function postSpecs(id){const f=data.files.find(f=>f.id===id),eventId=f?.eventId||'e1',e=data.events.find(e=>e.id===eventId);return eventId==='e1'?[['确认 SCM 闲置设备调配安排','今天 17:00'],['核对华东项目本周回款','今天 18:00']]:eventId==='e2'?[['确认 SCM 闲置设备原因','今天 17:00'],['落实 SCM 调配负责人及恢复时间','明天 10:00']]:eventId==='e3'?[['核对华东回款到账情况','明天 12:00'],['确认剩余款项付款时间','明天 18:00']]:[['确认「'+(e?.title||'本次会议')+'」会议结论','会后'],['落实「'+(e?.title||'本次会议')+'」后续行动','会后']]}
function showSheet(type,params={}){stash();lastFocus=document.activeElement;ui.sheet={type,...params};paintSheet()}
function closeSheet(restore=true){if(recordTimer){clearInterval(recordTimer);recordTimer=null}ui.recordStart=null;ui.sheet=null;document.querySelector('.overlay')?.remove();if(restore){if(lastFocus?.isConnected)lastFocus.focus();else app.querySelector('.topbar button')?.focus()}}
function paintSheet(){document.querySelector('.overlay')?.remove();if(!ui.sheet)return;const s=ui.sheet;let title='',content='';const g=data.goals.find(g=>g.id===s.id);if(s.type==='track'||s.type==='newGoal'){title=s.type==='track'?'持续跟踪 SCM':'新建跟踪目标';content=`<form id="goalForm" class="form"><label class="field"><span>目标</span><input name="title" required maxlength="60" value="${s.type==='track'?'SCM 设备出勤恢复至 80%':''}" placeholder="想持续关注哪件事？"></label><label class="field"><span>完成条件</span><textarea name="condition" required placeholder="怎样才算完成？">${s.type==='track'?'设备出勤率恢复至 80%，并连续保持 3 天':''}</textarea></label><label class="field"><span>截止日期</span><input name="date" type="date" required value="2026-11-16" min="2026-11-12"></label><label class="field"><span>什么时候提醒你</span><select name="rule"><option>关键变化或逾期时提醒</option><option>每天 09:30 汇报进展</option><option>仅完成时提醒</option></select></label><button class="primary full" type="submit">确认并开始跟踪</button></form>`}else if(s.type==='updateGoal'){title='补充进展';content=`<form id="updateForm" class="form"><label class="field"><span>${esc(g?.title)}</span><textarea name="update" required placeholder="记录最新情况、反馈或下一步…" maxlength="500"></textarea></label><button class="primary full" type="submit">保存进展</button></form>`}else if(s.type==='goalMenu'){title='目标操作';content=btn(icon('check')+' 标记完成','completeGoal',s.id,'sheet-choice')+btn(icon('edit')+' 补充进展','updateGoal',s.id,'sheet-choice')+btn(icon('share')+' 分享目标','share',s.id,'sheet-choice')}else if(s.type==='history'){title='历史对话';content=`${btn(icon('plus')+' 新对话','newChat','','sheet-choice')}<div class="section-line"><h2>最近</h2></div>${data.history.length?data.history.map(h=>btn(`<span>${esc(h.title)}<small>11 月 12 日 · ${h.messages.length} 条消息</small></span>${icon('right')}`,'loadHistory',h.id,'sheet-choice')).join(''):'<p class="sheet-desc">新建对话后，当前聊天会保存在这里。</p>'}${btn('<span>今天的经营简报<small>每日简报 · 09:30</small></span>'+icon('right'),'scene','brief','sheet-choice')}`}else if(s.type==='rename'){title='秘书名称';content=`<form id="renameForm" class="form"><label class="field"><span>名称</span><input name="name" required maxlength="20" value="${esc(data.name)}"></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='editMemory'){title='编辑记忆';content=`<form id="memoryForm" class="form"><label class="field"><span>身份角色</span><select name="role">${['CEO','大区经理','项目经理'].map(r=>`<option ${r===data.role?'selected':''}>${r}</option>`).join('')}</select></label><label class="field"><span>背景与偏好</span><textarea name="memory" required maxlength="1000" style="min-height:150px">${esc(data.memory)}</textarea></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='briefTime'){title='简报时间';content=`<form id="timeForm" class="form"><label class="field"><span>每天发送时间</span><input type="time" name="time" required value="${esc(data.settings.briefTime)}"></label><button type="submit" class="primary full">保存</button></form>`}else if(s.type==='connect'){const name=({nexus:'Nexus 经营数据',calendar:'钉钉日历',group:'项目群消息'})[s.id];title=name;content=`<p class="sheet-desc">${data.settings[s.id]?'已连接。可以读取与你角色相关的演示资料。断开后，原型将停止使用这个来源。':'连接后，Snack 可以结合相关信息准备简报和跟踪变化。'}</p><div class="info-row"><span>连接方式</span><span>原型模拟，不访问真实账号</span></div>${btn(data.settings[s.id]?'断开演示连接':'模拟连接','confirmConnect',s.id,'primary full')}`}else if(s.type==='attach'||s.type==='libraryAdd'){title=s.type==='attach'?'添加到对话':'添加资料';content=`${btn(icon('upload')+'<span>上传本地文件<small>仅保留名称，不上传文件内容</small></span>'+icon('right'),'pickFile','','sheet-choice')}${btn(icon('library')+'<span>从资料库选择</span>'+icon('right'),'chooseFile','','sheet-choice')}${s.type==='libraryAdd'?btn(icon('link')+'<span>同步 Nexus 项目资料<small>使用演示资料</small></span>'+icon('right'),'syncFiles','','sheet-choice'):''}<input id="fileInput" type="file" hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.mp3,.wav,.m4a,.png,.jpg">`}else if(s.type==='chooseFile'){title='选择资料';content=data.files.map(f=>btn(`<span>${esc(f.title)}<small>${esc(f.kind)}</small></span>${icon('plus')}`,'attachFile',f.id,'sheet-choice')).join('')}else if(s.type==='addEvent'||s.type==='editEvent'){const e=data.events.find(e=>e.id===s.id)||{title:'',date:ui.day,time:'15:00',end:'16:00',location:'线上会议 · 钉钉',desc:'',people:'你'};title=s.type==='addEvent'?'添加日程':'编辑日程';content=`<form id="eventForm" class="form"><label class="field"><span>日程名称</span><input name="title" required maxlength="60" value="${esc(e.title)}" placeholder="例如：项目经营复盘"></label><label class="field"><span>日期</span><input name="date" type="date" value="2026-11-${String(e.date).padStart(2,'0')}" required min="2026-11-09" max="2026-11-15"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1"><span>开始</span><input name="time" type="time" value="${e.time}" required></label><label class="field" style="flex:1"><span>结束</span><input name="end" type="time" value="${e.end}" required></label></div><label class="field"><span>地点</span><input name="location" value="${esc(e.location)}" required></label><label class="field"><span>议题</span><textarea name="desc" placeholder="准备讨论什么？">${esc(e.desc)}</textarea></label><p id="eventError" role="alert" style="font-size:12px;color:var(--red)"></p><button type="submit" class="primary full">保存日程</button></form>`}else if(s.type==='record'){title='会议录音';content=`<div class="recording"><span class="small-tag orange">模拟录音 · 不使用麦克风</span><div class="record-time" id="recordTime">00:00</div><div class="wave">${Array.from({length:26},(_,i)=>`<i style="height:${12+i*13%29}px;animation-delay:${i*.08}s"></i>`).join('')}</div><p>${esc(data.events.find(e=>e.id===s.id)?.title||'会议录音')}</p></div>${btn(icon('stop')+' 结束并生成纪要','stopRecord',s.id,'primary full')}`}else if(s.type==='generating'){title='正在整理会议';content='<p class="sheet-desc">录音已结束，正在生成演示纪要和待办。</p><div class="loading-line"></div>'}else if(s.type==='postTasks'){title='确认会后待办';const specs=postSpecs(s.id),f=data.files.find(f=>f.id===s.id);content=`<p class="sheet-desc">确认后加入日程待办，已确认过的事项不会重复添加。</p><form id="postForm" class="form">${specs.map(([title,time],i)=>`<label class="sheet-choice"><input type="checkbox" name="item${i}" checked><span>${esc(title)}<small>${esc(time)} · 我负责</small></span></label>`).join('')}${!f?.eventId||['e1','e2'].includes(f.eventId)?'<label style="display:flex;gap:10px;font-size:12px;align-items:center"><input type="checkbox" name="track" checked>同时持续跟踪 SCM 出勤恢复</label>':''}<button type="submit" class="primary full">确认待办</button></form>`}else if(s.type==='share'){title='分享';const file=data.files.find(f=>f.id===s.id),goal=data.goals.find(g=>g.id===s.id);content=`<div class="share-preview"><span class="small-tag orange">Snack · 演示卡片</span><h3>${esc(file?.title||goal?.title||'SCM 设备出勤异常')}</h3><p>${esc(file?.summary||goal?.summary||'今日出勤率 64%，6 台设备闲置，建议核实原因与调配安排。')}</p></div><p class="sheet-desc">选择渠道预览后续流程，不会发送真实消息。</p>${btn('<span>钉钉</span>'+icon('right'),'shareTarget','钉钉','sheet-choice')}${btn('<span>微信</span>'+icon('right'),'shareTarget','微信','sheet-choice')}`}else if(s.type==='shareTarget'){title=`分享到${s.target}`;const obj=data.files.find(f=>f.id===s.sharedId)||data.goals.find(g=>g.id===s.sharedId)||{title:'SCM 设备出勤异常',summary:'今日出勤率 64%，6 台设备闲置。请确认原因及恢复安排。'};content=`<div class="share-preview"><h3>项目运营群</h3><p><strong>${esc(obj.title)}</strong><br>${esc(obj.summary)}</p></div><p class="sheet-desc">这是分享流程演示。确认后将模拟跟踪群内反馈，不会发送真实消息。</p>${btn('模拟分享','shareDone',s.target,'primary full')}`}else if(s.type==='shareDone'){title='分享流程演示';const sharedGoal=data.goals.find(g=>g.id===s.sharedId)||(s.sharedId==='scm'?hasScm():null);content=`<div class="success-icon">${icon('check')}</div><p class="center">已模拟分享到项目运营群</p><p class="sheet-desc center" style="margin:12px 0 20px">${data.settings.group?'Snack 会结合群内反馈持续更新跟踪目标。':'群里还没有 Snack，可以模拟添加机器人，接收后续反馈。'}</p>${btn(data.settings.group?(sharedGoal?'查看跟踪目标':'完成'):'模拟添加 Snack 机器人',data.settings.group?(sharedGoal?'goal':'close'):'addBot',sharedGoal?.id||'','primary full')}${btn('稍后再说','close','','secondary full')}`}else if(s.type==='voice'){title='语音输入';content=`<div class="recording"><span class="small-tag orange">语音交互演示</span><div class="wave">${Array.from({length:20},(_,i)=>`<i style="height:${12+i*7%25}px;animation-delay:${i*.09}s"></i>`).join('')}</div><p>不启用麦克风，演示语音转文字。</p></div>${btn('使用示例语音','voiceResult','','primary full')}`}else if(s.type==='about'){title='关于这个原型';content='<p class="sheet-desc">参考 Muse 的聊天、目标、时间安排和资料产物分工，以及 Nexus × Snack 的业务方案。</p><p class="sheet-desc">业务数据、AI 回复、通知及外部连接为交互演示。会议录音使用麦克风并保存在当前浏览器，可下载备份。聊天语音沿用原型中的浏览器语音识别，需允许麦克风权限；不会发送真实业务消息。浏览器保存的状态可随时重置。</p>'+btn('了解了','close','','primary full')}else if(s.type==='reset'){title='恢复初始演示？';content='<p class="sheet-desc">会清空当前浏览器中新增的对话、目标、资料名称和设置，恢复初始示例；本机会议录音会保留。这个操作无法撤销。</p>'+btn('恢复初始演示','confirmReset','','primary full')+btn('取消','close','','secondary full')}
const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheetTitle">${title}</h2>${ib('关闭弹窗','close','close')}</div>${content}</section>`;app.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay&&s.type!=='generating')closeSheet()});overlay.querySelector('.sheet').focus();}
function toast(t){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;app.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2600)}
function scrollBottom(){requestAnimationFrame(()=>{const el=document.getElementById('scroll');if(el)el.scrollTop=el.scrollHeight})}
function hasScm(){return data.goals.find(g=>g.project==='SCM')}
function archive(){if(data.messages.length)data.history.unshift({id:'h'+Date.now(),title:data.messages.find(m=>m.type==='user')?.text||'项目经营沟通',messages:structuredClone(data.messages),fresh:ui.fresh});data.history=data.history.slice(0,10)}
function addUser(text){data.messages.push({type:'user',text});save()}
function answer(m){data.messages.push(m);save();ui.loading=false;render()}
function reply(m,delay=600){ui.loading=true;render();clearTimeout(responseTimer);responseTimer=setTimeout(()=>answer(m),delay)}
function pushChat(text,m){closeSheet(false);ui.page='main';ui.tab='chat';ui.previous=null;if(text)addUser(text);reply(m)}
function makeScm(overrides={}){if(hasScm())return hasScm();const g={id:'g'+Date.now(),title:'SCM 设备出勤恢复至 80%',project:'SCM',status:'active',progress:64,condition:'设备出勤率恢复至 80%，并连续保持 3 天',rule:'关键变化或逾期时提醒',date:'2026-11-16',summary:'今日出勤率 64%，6 台闲置设备待确认调配安排。',logs:[['今天 09:41','从经营异常分析开始跟踪，等待项目经理反馈。']],...overrides};data.goals.unshift(g);save();return g}
function prepData(event){const e=data.events.find(e=>e.id===event)||data.events[0];const points=e.id==='e1'?['SCM 闲置设备：确认原因、调配安排和恢复时间。','创新项目出勤：确认新增作业面的落实进度。','华东项目回款：核对尚未确认的 1 笔款项。']:e.id==='e2'?['核实 6 台闲置设备的具体原因。','确认可调配设备和负责人。','约定出勤恢复时间与下一次检查。']:e.id==='e3'?['核对已确认的 2 笔回款。','落实剩余 1 笔款项的预计付款时间。','复核大区设备利用情况与后续安排。']:[e.desc||'明确本次会议议题。','确认每个议题的负责人和需要决策的问题。','会后记录结论、行动和完成时间。'];return {e,points}}
function ensurePrep(event){const {e,points}=prepData(event),id='prep-'+e.id;let f=data.files.find(f=>f.id===id);if(!f){f={id,title:e.title+' · 会前简报',kind:'报告',folder:'reports',meta:'今天 09:41 · Snack 生成',summary:e.desc||'整理本次会议的议题与待确认事项。',points};data.files.unshift(f)}save();return f}
function addPrep(event){const f=ensurePrep(event);pushChat('帮我准备这次会议。',{type:'prepare',event,file:f.id})}

function submitChat(){const input=document.getElementById('draft'),text=input?.value.trim();if(!text)return;if(!ui.reference){sourceReply(text);return}if(ui.loading){toast('正在整理上一条回复');return}const file=ui.reference;ui.draft='';ui.reference=null;addUser(text);let m;if(file){const f=data.files.find(x=>x.id===file);m={type:'answer',file,text:f?.uploaded?'已把这份文件关联到对话。原型只记录文件名，未读取内容。你可以用示例资料继续体验分析与追踪。':`结合《${f?.title}》，当前重点是：\n${f?.summary}\n\n建议确认负责人和预计完成时间，再把需要跨会议跟进的事项设为持续目标。`}}else if(/SCM|闲置|出勤|异常|最需要/.test(text))m={type:'anomaly'};else if(/周会|会前|会议/.test(text)){ensurePrep('e1');m={type:'prepare',event:'e1'}}else if(/目标|进展|跟踪/.test(text))m={type:'progress'};else if(/经营|本周|简报/.test(text))m={type:'answer',file:'f1',text:'本周经营总体平稳，主要关注设备出勤与回款。\nSCM 和创新项目出勤低于目标，华东还有 1 笔回款待确认。安全整改已完成复核。\n建议把本次周会重点放在设备调配与剩余回款安排。'};else m={type:'answer',text:'这是交互原型，我先记下这条消息。当前可以演示：分析 SCM 异常、准备项目周会、查询目标进展，以及结合资料继续提问。'};reply(m)}
function handle(action,id,el){switch(action){case'sourceReply':{const o=nexusFocusOptions().find(o=>o.key===id);sourceReply(o.title+' '+o.subtitle,id);break}case'inputMode':stash();ui.inputMode=ui.inputMode==='text'?'voice':'text';render();if(ui.inputMode==='text')document.getElementById('draft')?.focus();break;case'tab':go(id);break;case'home':go('chat');break;case'back':back();break;case'settings':openPage('settings');break;case'memory':openPage('memory');break;case'sources':openPage('sources');break;case'reminders':openPage('reminders');break;case'goal':closeSheet(false);openPage('goal',id);break;case'event':openPage('event',id);break;case'file':closeSheet(false);ui.playing=false;openPage('file',id);break;case'folder':ui.folder=id;render();break;case'folderBack':ui.folder=null;render();break;case'fileFilter':ui.filter=id;render();break;case'clearSearch':ui.query='';render();break;case'day':ui.day=Number(id);render();break;case'today':ui.day=12;render();break;case'task':{const t=data.tasks.find(t=>t.id===id);t.done=!t.done;save();render();toast(t.done?'已完成待办':'已恢复待办');break}case'suggest':ui.draft=id;render();document.getElementById('draft')?.focus();break;case'clearReference':stash();ui.reference=null;render();break;case'anomaly':pushChat('看看 SCM 的具体情况。',{type:'anomaly'});break;case'progress':pushChat('帮我看看跟踪目标的进展。',{type:'progress'});break;case'prepare':addPrep(id);break;case'askFile':ui.inputMode='text';ui.reference=id;ui.draft='帮我总结这份资料的重点和下一步。';go('chat');document.getElementById('draft')?.focus();break;case'askGoal':{const g=data.goals.find(g=>g.id===id);pushChat(`「${g.title}」进展怎么样？`,{type:'answer',text:g.summary+'\n\n完成条件：'+g.condition+'。\n提醒规则：'+g.rule+'。'});break}case'track':showSheet('track');break;case'newGoal':showSheet('newGoal');break;case'updateGoal':showSheet('updateGoal',{id});break;case'goalMenu':showSheet('goalMenu',{id});break;case'pauseGoal':case'resumeGoal':case'completeGoal':{const g=data.goals.find(g=>g.id===id);g.status=action==='pauseGoal'?'paused':action==='completeGoal'?'done':'active';g.logs.unshift(['刚刚',action==='pauseGoal'?'你暂停了跟踪，暂停期间不再检查或提醒。':action==='completeGoal'?'你已确认目标完成，停止后续跟踪。':'你恢复了持续跟踪。']);if(action==='completeGoal')g.summary='你已确认完成，跟踪记录已保留。';closeSheet(false);save();render();toast(action==='pauseGoal'?'已暂停跟踪':action==='completeGoal'?'已完成目标':'已恢复跟踪');break}case'simulateUpdate':{const g=data.goals.find(g=>g.id===id);const text=g.project==='自定义目标'?'跟踪检查已完成，尚未发现新的相关资料。你可以点击「补充进展」记录实际情况。':g.project==='SCM'?'项目经理反馈：已调配 2 台设备，剩余 4 台预计明日安排。出勤率更新为 72%。':g.id==='g1'?'客户确认了剩余款项的付款安排，预计明日到账。':'项目经理已补充新的作业计划，正在等待现场确认。';g.summary=text;g.logs.unshift(['刚刚 · 演示更新',text]);data.messages.push({type:'update',id:g.id,title:g.title,text});save();render();toast('新进展已同步到目标和聊天');break}case'rename':case'editMemory':case'briefTime':case'about':case'history':case'reset':case'attach':case'libraryAdd':case'chooseFile':case'voice':showSheet(action);break;case'connect':showSheet('connect',{id});break;case'confirmConnect':data.settings[id]=!data.settings[id];save();closeSheet(false);render();toast(data.settings[id]?'演示连接已建立':'已断开演示连接');break;case'toggle':data.settings[id]=!data.settings[id];save();render();break;case'close':closeSheet();break;case'newChat':clearTimeout(responseTimer);ui.loading=false;stash();archive();data.messages=[];ui.fresh=true;ui.page='main';ui.tab='chat';ui.draft='';ui.reference=null;closeSheet(false);save();render();break;case'loadHistory':{clearTimeout(responseTimer);ui.loading=false;const h=data.history.find(h=>h.id===id);if(h){archive();data.messages=structuredClone(h.messages);ui.fresh=h.fresh;ui.page='main';ui.tab='chat';closeSheet(false);save();render()}break}case'confirmReset':clearTimeout(responseTimer);clearTimeout(generationTimer);closeSheet(false);data=initial();ui={tab:'chat',page:'main',filter:'全部',day:12,query:'',draft:'',reference:null,folder:null,sheet:null,loading:false,previous:null,onboardStep:0,onboardRole:'CEO'};save();render();toast('已恢复初始演示');break;case'addEvent':showSheet('addEvent');break;case'editEvent':showSheet('editEvent',{id});break;case'record':showSheet('record',{id});ui.recordStart=Date.now();recordTimer=setInterval(()=>{const node=document.getElementById('recordTime');if(node){const sec=Math.floor((Date.now()-ui.recordStart)/1000);node.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000);break;case'stopRecord':{clearInterval(recordTimer);recordTimer=null;const e=data.events.find(e=>e.id===id);showSheet('generating');generationTimer=setTimeout(()=>{const fid='record'+Date.now();data.files.unshift({id:fid,title:e.title+' · 11 月 '+e.date+' 日',kind:'录音',folder:'meetings',meta:'今天 · 演示录音',eventId:e.id,summary:e.id==='e1'?'确认 SCM 设备调配和华东回款两项后续工作；对应负责人应在今日反馈。':e.desc||'已整理本次会议的结论与后续安排。',points:prepData(e.id).points});e.recorded=fid;save();pushChat(null,{type:'summary',file:fid})},900);break}case'postTasks':showSheet('postTasks',{id});break;case'share':showSheet('share',{id});break;case'shareTarget':showSheet('shareTarget',{target:id,sharedId:ui.sheet.id});break;case'shareDone':{const id=ui.sheet.sharedId;if(id==='scm')makeScm();showSheet('shareDone',{sharedId:id});break;}case'addBot':data.settings.group=true;save();showSheet('shareDone',{sharedId:ui.sheet.sharedId});toast('已模拟添加机器人');break;case'voiceResult':closeSheet(false);ui.page='main';ui.tab='chat';ui.draft='帮我看看 SCM 项目的设备闲置情况。';render();document.getElementById('draft')?.focus();toast('示例语音已转为文字，确认后发送');break;case'pickFile':document.getElementById('fileInput')?.click();break;case'attachFile':ui.inputMode='text';ui.reference=id;closeSheet(false);go('chat');toast('资料已关联到输入框');break;case'syncFiles':if(!data.files.some(f=>f.id==='synced'))data.files.unshift({id:'synced',title:'SCM 今日台班表.xlsx',kind:'文件',folder:'scm',meta:'刚刚 · Nexus 同步演示',summary:'SCM 设备台班与出勤明细。'});save();closeSheet(false);go('library');toast('已同步 1 份演示资料');break;case'play':ui.playing=!ui.playing;render();if(ui.playing){toast('播放状态演示，不含真实音频');clearTimeout(playTimer);playTimer=setTimeout(()=>{ui.playing=false;if(ui.page==='file')render()},6000)}break;case'onboard':closeSheet(false);ui.page='onboarding';ui.onboardStep=0;render();break;case'skipOnboard':case'finishOnboard':data.onboarded=true;save();ui.fresh=false;go('chat');break;case'onboardNext':if(ui.onboardStep===0){data.name=document.getElementById('onboardName').value.trim()||'Snack';data.role=document.getElementById('onboardRole').value;ui.onboardRole=data.role;save()}if(ui.onboardStep===1){const interests=[...document.querySelectorAll('.option-button.selected span')].map(x=>x.textContent);data.memory=`我在鼎昌担任${data.role}，重点关注${interests.length?interests.join('、'):'项目经营'}。汇报先给结论，再给依据。`;save()}ui.onboardStep++;render();break;case'interest':el.classList.toggle('selected');el.setAttribute('aria-checked',el.classList.contains('selected'));break;case'scene':closeSheet(false);ui.loading=false;clearTimeout(responseTimer);if(id==='onboarding'){ui.page='onboarding';ui.onboardStep=0;render()}else if(id==='meeting'){ui.tab='calendar';ui.page='event';ui.id='e1';ui.previous={tab:'calendar',page:'main'};render()}else if(id==='anomaly')sourceReply('帮我找找异常项目','safety');else{ui.fresh=false;go('chat');requestAnimationFrame(()=>document.getElementById('scroll').scrollTop=0)}break;}}

function respondToChat(text,key) {

  else if(/持续|帮我盯|跟进这/.test(text)){makeScm();upgradeData();m={type:'tracked',id:hasScm().id,title:hasScm().title};}
  else if(key==='safety'||/SCM|闲置|出勤|异常/.test(text))m={type:'anomaly'};
  else if(key==='briefing'||/简报|经营|上周|产值/.test(text))m={type:'answer',file:'f1',text:'演示经营资料中，SCM 的设备作业条件与华东回款需要继续核实。请先查看相关依据，再决定需要跟进哪一项。'};

  ui.page='main';ui.tab='chat';ui.stack=[];save();reply(m,350);

function confirmPostItems(fid,items) {
  const f=data.files.find(f=>f.id===fid),result=[];data.confirmedPostItems ||= {};
  items.forEach((item,i)=>{
    if(!item.selected)return;
    const key=`follow-${fid}-${i}`;
    const project=f?.eventId==='e2'||(f?.eventId==='e1'&&i===0)?'SCM':f?.eventId==='e3'||(f?.eventId==='e1'&&i===1)?'华东大区':null;
    const existingId=project==='SCM'?hasScm()?.id:project==='华东大区'?'g1':null;
    let g=data.goals.find(g=>g.id===(data.confirmedPostItems[key]||existingId||key));
    if(!g){g={id:key,title:item.title,project:project||'会议后续',owner:item.owner||'你',status:'active',condition:'落实安排，并提供结果或完成依据',date:(item.time||'2026-11-20').slice(0,10),nextCheck:item.time||'2026-11-14T09:30',lastCheck:'刚刚',rule:'关键变化或逾期时提醒',sourceKey:'calendar',sourceProvider:data.events.find(event=>event.id===f?.eventId)?.provider||null,sourceIds:[fid],summary:'会后已确认，等待负责人反馈。',logs:[]};data.goals.unshift(g)}
    if(!data.confirmedPostItems[key]){
      g.sourceIds ||= [];if(!g.sourceIds.includes(fid))g.sourceIds.push(fid);
      g.logs.unshift(['刚刚 · 会议确认',`${item.title}；负责人：${item.owner||'你'}${item.time?'；安排：'+checkLabel(item.time):''}。`]);
      data.confirmedPostItems[key]=g.id;
    }
    if(item.time&&!data.events.some(e=>e.id==='event-'+key)){
      const start=item.time.slice(11,16),minutes=Number(start.slice(0,2))*60+Number(start.slice(3)),endMinutes=Math.min(minutes+15,1439);
      data.events.push({id:'event-'+key,title:item.title,goalId:g.id,type:'work',day:item.time.slice(0,10),date:Number(item.time.slice(8,10)),time:start,end:String(Math.floor(endMinutes/60)).padStart(2,'0')+':'+String(endMinutes%60).padStart(2,'0'),people:item.owner||'你',location:'',desc:'会议确认的后续工作，进展保留在关联事项中。'});

}
const baseHandle=handle;
handle = function(action,id,el) {
  if(action==='sourceReply'){const o=nexusFocusOptions().find(o=>o.key===id);respondToChat(o?.title||'',id);return}
  if(action==='today'){ui.day=13;ui.selectedDate=DEMO_DATE;render();return}
  if(action==='shiftWeek'){ui.selectedDate=shiftDay(calendarDate(),Number(id));ui.day=Number(ui.selectedDate.slice(8));render();return}
  if(action==='day'){ui.selectedDate=id.includes('-')?id:undefined;ui.day=Number(id.slice(-2));render();return}
  if(action==='clearGoalReference'){ui.goalReference=null;render();return}
  if(action==='askGoal'){const g=data.goals.find(g=>g.id===id);markGoalRead(id);ui.goalReference=id;go('chat');ui.inputMode='text';ui.draft='';render();document.getElementById('draft')?.focus();return}
  if(action==='askFile'){ui.goalReference=null;}
  if(action==='simulateUpdate'||action==='simulateDecision'){createUpdate(id,action==='simulateDecision');return}
  if(action==='discussScm'){const g=hasScm()||makeScm();upgradeData();handle('askGoal',g.id);return}
  if(['editGoal','memoryItem','newMemory','removeMemory'].includes(action)){showSheet(action,{id});return}
  if(action==='confirmRemoveMemory'){data.memories=data.memories.filter(m=>m.id!==id);save();closeSheet(false);render();toast('记忆已移除');return}
  if(action==='draftGoal'){showSheet('newGoal',{draft:'持续跟进'+id});return}
  if(action==='completeEvent'){const e=data.events.find(e=>e.id===id);if(!e.done){e.done=true;save();render();toast('已完成这项安排，关联事项继续按完成条件复核')}return}
  if(action==='syncFiles'&&!data.settings.nexus){toast('请先连接 Nexus');return}
  if(action==='prepare'&&!data.settings.calendar){toast('日历已断开，暂不生成新的会前资料');return}
  if(action==='confirmReset'){
    clearTimeout(responseTimer);clearTimeout(generationTimer);closeSheet(false);data=initial();upgradeData();ui={tab:'chat',page:'main',filter:'全部',day:13,query:'',draft:'',reference:null,goalReference:null,folder:null,sheet:null,loading:false,previous:null,stack:[],onboardStep:0,onboardRole:'CEO'};save();render();toast('已恢复初始演示');return;
  }
  if(['newGoal','track'].includes(action)){showSheet(action);return}
  if(action==='completeGoal'){
    const g=data.goals.find(g=>g.id===id);g.status='done';g.summary='你已确认完成，结果与依据保留在进展记录中。';g.logs.unshift(['刚刚','你确认事项已完成，后续检查已停止。']);markGoalRead(id);save();closeSheet(false);render();return;
  }
  if(action==='scene'&&id==='anomaly'){respondToChat('看看 SCM 的具体情况。','safety');return}
  if(action==='scene'&&id==='meeting'){go('calendar');openPage('event','e1');return}
  baseHandle(action,id,el);
};

  }else if(form.id==='workPostForm'){

  }else if(form.id==='updateForm'){
    const g=data.goals.find(g=>g.id===ui.sheet.id),t=get('update');if(!g||!t)return;g.summary=t;g.logs.unshift(['刚刚 · 你补充',t]);save();closeSheet(false);render();toast('情况已补充');
  }
},true);

function requiredScopes(kind,template) {
  if(kind==='calendar')return (CALENDAR_SCENARIOS.find(s=>s.id===template)||CALENDAR_SCENARIOS[0]).scopes;
  if(kind==='post')return ['calendar','minutes'];
  if(kind==='provider')return ['calendar','minutes','projectMessages'];

  {id:'dingtalk',name:'钉钉日程',place:'钉钉会议'},
  {id:'wecom',name:'企业微信日程',place:'企业微信会议'},

function upgradeCalendarSelection(){
  data.calendarConnections ||= {};
  data.meetingPreferences ||= {};
  if(data.calendarTrackingRevision!==3){
    Object.keys(data.meetingPreferences).forEach(id=>{const old=data.meetingPreferences[id];const enabled=!!(old.before||old.during||old.after);data.meetingPreferences[id]={before:enabled,during:enabled,after:enabled}});
    data.calendarTrackingRevision=3;
  }
  if(data.calendarWorkflowRevision!==2){
    data.events=data.events.filter(e=>e.id!=='activated-meeting');
    data.calendarAssistants={before:false,during:false,after:false};
    data.calendarActivated=data.events.length>0;
    data.calendarWorkflowRevision=2;
  }
  data.calendarAssistants={before:Object.values(data.meetingPreferences).some(p=>p.before),during:Object.values(data.meetingPreferences).some(p=>p.during),after:Object.values(data.meetingPreferences).some(p=>p.after)};
}
upgradeCalendarSelection();

calendar=function(){
  const title='<h1 class="sr-only">日程</h1>';
  if(!data.events.length)return `<section class="page calendar-welcome">${title}${calendarEntryRows()}</section>`;
  return calendarBeforeNov14().replace(`<div class="page-title"><h1>日程</h1>${ib('添加日程','plus','addEvent')}</div>`,title).replace(`<div class="empty">${icon('calendar')}<p>这一天没有安排</p>${btn('添加日程','addEvent','','secondary')}</div>`,'<p class="calendar-day-empty">这一天没有安排</p>').replace('</section>',`${calendarEntryRows()}</section>`);
};

    if (file.uploaded || kind === '知识库' || ['upload','uploaded','user-upload','knowledge','knowledgebase'].includes(source) || /上传|本地文件名/.test(meta) || /nexus/.test(source + ' ' + meta.toLowerCase())) return 'reference';
    const generated = file.generated === true || source === 'snack' || /Snack\s*(?:生成|推送)/i.test(meta);
    // Scheduled business briefs use their linked brief goal, never an ID prefix alone.
    if (generated && (data.goals || []).some(goal => goal.template === 'brief' && file.id === 'brief-' + goal.id)) return 'daily';
    if (file.eventId || String(file.id || '').startsWith('prep-') || kind === '录音' || kind === '会议纪要' ||
        (generated && /会前|会议纪要|会议记录|会议录音/.test(title))) return 'meetings';
    if (generated && /^(?:(?:今日|每日|早间|晨间|晚间)(?:经营)?简报|(?:经营)?日报)(?:[\s·\-\d年月日]|$)/.test(title)) return 'daily';
    if (generated || ['报告', '表格', '方案', '草案'].includes(kind)) return 'analysis';
    return 'reference';
  };
  const fileTime = file => {
    for (const value of [file.updatedAt, file.modifiedAt, file.generatedAt, file.createdAt, file.timestamp]) {
      if (typeof value === 'number' && Number.isFinite(value) && value >= 1e9) return value < 1e12 ? value * 1000 : value;
      if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}(?:T|$)/.test(value)) {
        const parsed = Date.parse(value);if (Number.isFinite(parsed)) return parsed;
      }
    }
    return null;
  };
  const recentFiles = files => {
    const rows = files.map((file, index) => ({file, index, time:fileTime(file)}));
    const dated = rows.filter(row => row.time !== null).sort((a,b) => b.time - a.time || a.index - b.index);
    let next = 0;
    // Undated legacy records retain their original slots; no date is inferred from display copy.
    return rows.map(row => row.time === null ? row.file : dated[next++].file);
  };
  const libFileMatches = file => libMatches([file.title, file.summary, file.kind, file.meta, FILE_COLLECTIONS[fileCollection(file)]]);
  const libScopeFiles = id => {
    const collection = id?.startsWith('collection/') ? id.slice('collection/'.length) : null;
    return data.files.filter(file => !id || (collection && FILE_COLLECTIONS[collection] ? fileCollection(file) === collection : file.folder === id));
  };
  const libFolderMatches = id => {
    if (!libQuery() || libMatches([libTitle(id)])) return true;
    if (id === 'memory') return (data.memories || []).some(libMemoryMatches) || data.goals.some(libGoalMatches) || data.events.some(libEventMatches);
    if (id === 'memory/profile') return profileMemories().some(libMemoryMatches);
    if (id === 'memory/tracking') return projectMemories().some(libMemoryMatches) || data.goals.some(libGoalMatches) || data.events.some(libEventMatches);
    if (id === 'memory/calendar') return data.events.some(libEventMatches);
    return libScopeFiles(id).some(libFileMatches);
  };
  const libFolderMeta = id => {
    if (id === 'memory') return `${profileMemories().length} 条记忆`;
    if (id === 'memory/profile') return `${profileMemories().length} 条记忆`;
    if (id === 'memory/tracking') return `${data.goals.length} 件跟进 · ${projectMemories().length} 条背景${data.events.length ? ' · '+data.events.length+' 项日程' : ''}`;
    if (id === 'memory/calendar') return `${data.events.length} 项日程`;
    return `${libScopeFiles(id).length} 份文件`;
  };
  const libFolder = id => `<button class="lib16-folder" data-action="folder" data-id="${esc(id)}"><span class="lib16-folder-icon">${icon('folder')}</span><strong>${esc(libTitle(id))}</strong><small>${libFolderMeta(id)}</small></button>`;
  const libFolderGrid = ids => ids.length ? `<div class="lib16-folder-grid lib-split-folders">${ids.map(libFolder).join('')}</div>` : '';
  const libMemoryRow = item => `<button class="folder-row lib14-memory" data-action="memoryItem" data-id="${esc(item.id)}"><span class="file-icon">${icon('file')}</span><span class="file-info"><strong>${esc(item.title)}</strong><span class="lib14-row-summary">${esc(item.text)}</span><small>${esc(item.origin || '你提供的背景')}${item.updated ? ' · ' + esc(item.updated) : ''}</small></span>${icon('right')}</button>`;
  const libGoalRecord = goal => `<div class="lib14-record">${goalRow(goal)}${goal.logs?.length ? `<details class="lib14-history"><summary>历史记录 · ${goal.logs.length}</summary><div class="timeline">${goal.logs.map(([time, content]) => `<div class="timeline-item"><time>${esc(time)}</time><p>${esc(content)}</p></div>`).join('')}</div></details>` : ''}</div>`;
  const libEventRecord = event => `<div class="lib14-record"><button class="folder-row lib14-event" data-action="event" data-id="${esc(event.id)}"><span class="file-icon">${icon('calendar')}</span><span class="file-info"><strong>${esc(event.title)}</strong><small>${esc(shortDate(fullDay(event)))} · ${esc(event.time || '')}${event.end ? '–' + esc(event.end) : ''}</small>${event.desc ? `<span class="lib14-row-summary">${esc(event.desc)}</span>` : ''}</span>${icon('right')}</button></div>`;
  const libEmpty = (text, action = '', label = '') => `<div class="empty lib14-empty"><p>${esc(text)}</p>${libQuery() ? btn('清除搜索', 'clearSearch', '', 'linklike') : action ? btn(label, action, '', 'linklike') : ''}</div>`;
  const fileFolders = () => ['collection/daily', 'collection/meetings'];

function goalSourceConnected(goal){

  if(goal.sourceKey==='calendar'){

function previewMemoryImport(values){
  const source=['ChatGPT','Claude','其他应用'].includes(values.source)?values.source:'其他应用';
  const title=String(values.title||'').trim(),text=String(values.text||'').trim();
  if(!title||!text)return {ok:false,error:'补充标题和要导入的记忆。'};
  if(title.length>40||text.length>1000)return {ok:false,error:'标题最多 40 字，记忆内容最多 1000 字。'};
  if(!['关于我','偏好','项目背景'].includes(values.category))return {ok:false,error:'选择这条记忆的分类。'};
  ui.memoryImportSequence=(ui.memoryImportSequence||0)+1;
  ui.memoryImport={source,title,text,category:values.category,token:'memory-import-'+Date.now()+'-'+ui.memoryImportSequence};

}

}

  function cal17IsHistory(event,now=Date.now()){

    const snapshot=structuredClone(d);delete snapshot.id;delete snapshot.revision;delete snapshot.existingGoalId;
    if(!g){g={id:'goal-'+d.id,status:'active',phase:'tracking',owner:'我',date:'',nextCheck:'',sourceIds:[],logs:[]};data.goals.unshift(g)}
    Object.assign(g,{flowVersion:3,conversationDemo:true,title:d.title||d.project,project:d.project,template:d.template,templateId:d.templateId,focus:d.focus,
      rule:d.rule,changeCriteria:d.criteria,condition:'你确认结束时停止跟进。',sourceKey:'manual',setupSnapshot:snapshot,lastCheck:'刚刚',
      summary:d.template==='brief'?d.rule+'整理经营简报，先看需要关注的变化。':d.template==='meeting'?'下次周会前核对待办，整理未完成事项与待决策问题。':d.criteria});
    g.logs.unshift(['刚刚',d.existingGoalId?'已根据对话更新演示目标。':'已根据对话建立演示目标，等待新的进展。']);
    if(d.note)g.logs.unshift(['刚刚',d.note]);
    if(d.sourceFileId)g.sourceIds=[d.sourceFileId];
    if(originAction){originAction.goalId=g.id;originAction.pendingReason='';Object.assign(g,{eventId:originEvent.id,cal17EventId:originEvent.id,cal17:true})}
    d.confirmedGoalId=g.id;data.messages.push({type:'demoFollowCreated',followId:d.id,goalId:g.id,text:d.existingGoalId?'好，跟进安排已更新。':'好，已经开始跟进「'+g.title+'」。'});
    resetComposer();save();go('goals');toast(d.existingGoalId?'跟进安排已更新':'已开始跟进');return g.id;
  }
  startFollowConversation=function(text,template='risk'){return begin(SCENARIOS[template]||template==='scm-plan'?template:'custom',text)};
  consumeFollowReply=function(text,d){
    if(!isDemo(d))return previous.consume(text,d);
    text=String(text||'').trim();if(!text)return;
    data.messages.push({type:'user',text});
    if(/^(取消|取消设置|先不设置|先不跟进)[。！!\s]*$/.test(text)){d.cancelled=true;resetComposer();save();go('goals');return}
    if(d.stage==='scope'){scope(d,text);review(d)}
    else if(d.stage==='review'){
      if(/^(好[的]?|好，就这样跟进|就这样|可以|确认|开始跟进|保持原来的安排)[。！!\s]*$/.test(text)){finish(d);return}
      if(text==='有变化时在 Snack 告诉我'){d.channel='snack';finish(d);return}
      d.note='补充要求：'+text;
      if(/Snack|不要钉钉/.test(text))d.channel='snack';else if(/钉钉/.test(text))d.channel='dingtalk';
      const time=text.match(/(\d{1,2})[:：点](\d{2})?/);
      if(d.template==='brief'&&time&&Number(time[1])<24&&Number(time[2]||0)<60){d.time=time[1].padStart(2,'0')+':'+(time[2]||'00');d.rule=(/工作日/.test(text)?'每个工作日 ':'每天 ')+d.time}
      else if(d.template!=='brief'&&d.template!=='meeting'&&!/Snack|钉钉/.test(text))d.criteria=text;
      review(d);
    }
    followRender();
  };
  message=function(m){
    if(m.type==='demoFollowQuestion'){
      const token=m.followId+':'+m.revision,active=isDemo(activeFollowDraft())&&followToken()===token;
      return `<div class="source-message-row"><div class="source-bubble rich-bubble follow-question"><p>${esc(m.text).replace(/\n/g,'<br>')}</p>${active&&m.options?.length?`<div class="follow-options">${m.options.map((label,index)=>`<button class="follow-option" type="button" data-action="demoFollowAnswer" data-id="${esc(token+':'+index)}">${esc(label)}</button>`).join('')}</div>`:''}</div></div>`;
    }
    if(m.type==='demoFollowCreated')return sourceBubble(m.text,`<div class="actions">${btn('查看跟进事项','goal',m.goalId,'linklike')}</div>`);
    return previous.message(m);
  };
  goals=function(){
    const active=data.goals.filter(g=>g.status!=='done'),done=data.goals.filter(g=>g.status==='done'),templates=getFollowTemplates();
    return `<section class="page follow-page"><h1 class="sr-only">持续跟进</h1>${active.length?`<div class="section-line"><h2>跟进中</h2></div><div class="follow-active-goals">${active.map(goalRow).join('')}</div>`:''}${templates.length?`${active.length||done.length?'<div class="section-line follow-add-heading"><h2>我还能帮你</h2></div>':''}${templateRows()}`:''}${done.length?`<details class="finished-work"><summary>已结束 <span>${done.length}</span></summary>${done.map(goalRow).join('')}</details>`:''}</section>`;
  };
  goalRow=function(g){
    if(!isDemo(g))return previous.goalRow(g);
    return `<button class="work-row" data-action="goal" data-id="${esc(g.id)}"><span class="work-icon">${icon(g.template==='brief'?'clock':g.template==='meeting'?'calendar':'target')}</span><span class="work-body"><span class="work-title">${esc(g.title)}</span><span class="work-summary">${esc(g.summary)}</span>${g.status==='paused'?'<span class="work-meta">已暂停</span>':''}</span>${icon('right')}</button>`;
  };
  goalDetail=function(){
    const g=data.goals.find(x=>x.id===ui.id);if(!isDemo(g))return previous.goalDetail();
    return `<section class="page follow-detail"><div class="detail-hero"><div class="detail-state">${icon('target')}${g.status==='done'?'已结束':g.status==='paused'?'已暂停':'跟进中'} · 演示</div><h1>${esc(g.title)}</h1><p>${esc(g.summary)}</p></div><div class="section-line"><h2>跟进动态</h2>${btn('补充进展','updateGoal',g.id,'linklike')}</div><div class="timeline">${g.logs.map(([time,text])=>`<div class="timeline-item"><time>${esc(time)}</time><p>${esc(text)}</p></div>`).join('')}</div></section>`;
  };
  goalSourceConnected=function(g){return isDemo(g)||previous.source(g)};
  handle=function(action,id='',el){
    if(action==='startTemplate'){const t=followTemplate(id);if(t)return begin(id,t.title)}
    if(['customFollow','newGoal','followGoChat'].includes(action))return begin('custom');
    if(['track','draftGoal','discussScm'].includes(action))return begin('risk','帮我持续跟进'+(id&&id!=='scm'?id:' SCM 项目的重要变化')+'。');
    if(action==='postTasks'&&data.files.some(f=>f.id===id)){const file=data.files.find(f=>f.id===id);return begin('meeting','帮我跟进「'+file.title+'」里的待办。',null,{meetingTitle:file.title,sourceFileId:file.id})}
    if(action==='cal17Clarify'){
      const [eventId,key]=id.split('|'),event=data.events.find(x=>x.id===eventId),item=event?.cal17Actions?.find(x=>x.key===key);
      if(item){if(item.goalId&&data.goals.some(g=>g.id===item.goalId))return previous.handle('goal',item.goalId,el);return begin('custom','帮我跟进「'+item.title+'」。',null,{originEventId:eventId,originActionKey:key})}
    }
    if(action==='editGoal'&&isDemo(data.goals.find(g=>g.id===id))){const g=data.goals.find(g=>g.id===id);return begin(g.template,'我想调整「'+g.title+'」的跟进安排。',g)}
    const d=activeFollowDraft();
    if(action==='demoFollowAnswer'){
      const parts=id.split(':'),token=parts.slice(0,2).join(':');if(!isDemo(d)||followToken(d)!==token)return;
      const m=data.messages.find(m=>m.type==='demoFollowQuestion'&&m.followId===d.id&&m.revision===d.revision),text=m?.options?.[Number(parts[2])];
      if(text)consumeFollowReply(text,d);return;
    }
    if(action==='followCancel'&&isDemo(d)&&d.id===id){d.cancelled=true;resetComposer();save();go('goals');return}
    previous.handle(action,id,el);
  };
  // Continue an unfinished older setup as chat, without discarding its conversation.
  const old=activeFollowDraft();
  if(old&&!isDemo(old)){
    const migrated=draft(old.template||'custom');
    for(const key of ['project','focus','criteria','rule','channel','templateId','existingGoalId'])if(old[key])migrated[key]=old[key];
    data.followDraft=migrated;opening(migrated);save();
  }
})();
// END CONVERSATIONAL FOLLOWUP 17

render();
</script>
</body></html>
